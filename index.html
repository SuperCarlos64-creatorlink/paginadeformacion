const firebaseConfig = { apiKey: "AIzaSyDGApAG4sGGxqzTNjSGENz8jC1DxFb8h8U", authDomain: "proyecto-de-formacion-80777.firebaseapp.com", projectId: "proyecto-de-formacion-80777", storageBucket: "proyecto-de-formacion-80777.firebasestorage.app", messagingSenderId: "975813170537", appId: "1:975813170537:web:5ecf041db5d9e11d84d9f8" };
const app = initializeApp(firebaseConfig);

  // Continente 4 - abajo izq
  pCtx.fillStyle='#66bb6a'; pCtx.beginPath(); pCtx.moveTo(22,98); pCtx.lineTo(68,94); pCtx.lineTo(72,138); pCtx.lineTo(28,142); pCtx.closePath(); pCtx.fill(); pCtx.stroke();
  // Continente 5 - abajo der

  // Carita - ojos fijos

  pCtx.fillStyle='#ff8a80'; pCtx.beginPath(); pCtx.arc(60,118,5,0,Math.PI*2); pCtx.arc(162,118,5,0,Math.PI*2); pCtx.fill();

  pCtx.beginPath(); pCtx.ellipse(172,38,18,9,0,0,Math.PI*2); pCtx.fill(); pCtx.stroke();
  pCtx.beginPath(); pCtx.ellipse(50,176,20,10,0,0,Math.PI*2); pCtx.fill(); pCtx.stroke();
  pCtx.beginPath(); pCtx.ellipse(162,166,16,8,0,0,Math.PI*2); pCtx.fill(); pCtx.stroke();
}
drawPlanetStatic();

const topics={
  tipos:{c:'#ff7043',ico:'🗑️',lbl:'TIPOS',title:'🗑️ TIPOS DE CONTAMINACIÓN EN LA ESCUELA',

  conse:{c:'#ef5350',ico:'⚠️',lbl:'CONSECUENCIAS',title:'⚠️ CONSECUENCIAS REALES EN LA ESCUELA',

    <li><b>1. Salud:</b> +35% de faltas por infecciones estomacales y respiratorias según enfermería en últimos 2 meses (marzo-abril 2026). Acumulación de polvo, cucarachas en botes sin tapa, mosquitos por agua estancada. 8 alumnos con alergias.</li>

    html:`<h3>Plan en 5 pasos - Probado en otras secundarias de Oaxaca</h3><div class="dato"><b>Meta:</b> En 1 mes reducir 60% de PET, 0 drenajes tapados y mejorar calificación de higiene de 6.2 a 9.0</div>

};

const positions=[{id:'tipos',x:8,y:8},{id:'causas',x:74,y:6},{id:'conse',x:78,y:64},{id:'solu',x:8,y:68},{id:'yo',x:1,y:38}];
const nodesDiv=document.getElementById('nodes'); const svg=document.getElementById('lines');
function getPlanetBorder(ex,ey){ const cx=window.innerWidth/2, cy=window.innerHeight*0.48; const ang=Math.atan2(ey-cy, ex-cx); const r=110; return {x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r}; }
function drawLines(){ svg.innerHTML=''; positions.forEach(p=>{ const el=document.getElementById('node-'+p.id); if(!el) return; const rect=el.getBoundingClientRect(); const ex=rect.left+rect.width/2, ey=rect.top+rect.height/2; const start=getPlanetBorder(ex,ey); const ang=Math.atan2((window.innerHeight*0.48)-ey, (window.innerWidth/2)-ex); const nodeBX=ex+Math.cos(ang)*(rect.width/2+8), nodeBY=ey+Math.sin(ang)*(rect.height/2+8); const midX=(start.x+nodeBX)/2, midY=(start.y+nodeBY)/2 - 18; const bg=document.createElementNS('http://www.w3.org/2000/svg','path'); bg.setAttribute('d',`M ${start.x} ${start.y} Q ${midX} ${midY} ${nodeBX} ${nodeBY}`); bg.setAttribute('stroke','#000'); bg.setAttribute('stroke-width','10'); bg.setAttribute('fill','none'); bg.setAttribute('stroke-linecap','round'); const fg=document.createElementNS('http://www.w3.org/2000/svg','path'); fg.setAttribute('d',`M ${start.x} ${start.y} Q ${midX} ${midY} ${nodeBX} ${nodeBY}`); fg.setAttribute('stroke',topics[p.id].c); fg.setAttribute('stroke-width','6'); fg.setAttribute('fill','none'); fg.setAttribute('stroke-linecap','round'); svg.appendChild(bg); svg.appendChild(fg); }); }
positions.forEach(p=>{ const d=document.createElement('div'); d.id='node-'+p.id; d.className='node'; d.style.left=p.x+'%'; d.style.top=p.y+'%'; d.style.setProperty('--c',topics[p.id].c); d.innerHTML=`<span class="ico">${topics[p.id].ico}</span><span class="txt">${topics[p.id].lbl}</span>`; d.onclick=()=>openModal(p.id); nodesDiv.appendChild(d); });
window.addEventListener('resize',drawLines); setTimeout(drawLines,350);
const modal=document.getElementById('modal'), box=document.getElementById('box');
async function openModal(id){
  if(id==='home'){ const rank=await loadRanking(); let rh='<div id="ranking"><b>🏆 RANKING REAL - FIREBASE</b><br>'+(rank.length? rank.map((r,i)=>`${i+1}. ${r.nombre} - ${r.puntos} pts N${r.nivel}`).join('<br>'):'Aún no hay puntajes, ¡sé el primero!')+'</div>'; box.innerHTML=`<h2>🌍 ECO ESCUELA - PROYECTO FORMACIÓN</h2><p>Proyecto: Contaminación en mi escuela - Secundaria Cuilapan<br>Alumno: <b>Carlos</b> | Conectado: <b>${currentUser?currentUser.uid.slice(0,8):'...'}</b> | 1 score por día</p>${rh}<br><button class="btn g" onclick="startGame()">🎮 JUGAR AHORA</button><button class="btn" onclick="closeModal()">EXPLORAR MAPA</button>`; }
  else { const t=topics[id]; box.innerHTML=`<h2>${t.title}</h2>${t.html}<br><button class="btn" onclick="closeModal()">CERRAR</button>`; }
  modal.classList.add('active');
}
function closeModal(){ modal.classList.remove('active'); }
window.closeModal=closeModal; window.openModal=openModal;
document.getElementById('planetCanvas').addEventListener('click',()=>openModal('home'));
const game=document.getElementById('game'), cvs=document.getElementById('canvasGame'), ctx=cvs.getContext('2d');
const hScore=document.getElementById('hScore'), hTime=document.getElementById('hTime'), hMsg=document.getElementById('hMsg'), hSlow=document.getElementById('hSlow');
let keys={}, running=false, score=0, time=0, level=1, items=[], waters=[], player={x:450,y:260,w:28,h:28,s:4.2,slowUntil:0}, raf, timerInt;
function spawnLevel(lv){ items=[]; waters=[]; level=lv; score=0; time=70+lv*10; player.x=450; player.y=260; player.slowUntil=0; const pool=[{c:'#ff7043',e:'🥤',msg:'PET 450 años'},{c:'#fff',e:'📄',msg:'Papel 7 vidas'},{c:'#d7a35a',e:'🍌',msg:'Composta 30 días'},{c:'#a5d6a7',e:'♻️',msg:'Separa -60%'}]; for(let i=0;i<20+lv*3;i++){ const t=pool[Math.floor(Math.random()*pool.length)]; items.push({x:Math.random()*840+10,y:Math.random()*460+30,w:26,h:26,c:t.c,e:t.e,msg:t.msg,ok:false}); } for(let i=0;i<4+lv;i++){ waters.push({x:Math.random()*700+50,y:Math.random()*380+50,w:90,h:50}); } hScore.textContent=`0/${items.length}`; hMsg.textContent=`NIVEL ${lv}`; }
function drawGame(){ ctx.fillStyle=level==1?'#dcedc8':level==2?'#fff9c4':'#c8e6c9'; ctx.fillRect(0,0,cvs.width,cvs.height); ctx.fillStyle='rgba(0,0,0,0.06)'; for(let x=0;x<cvs.width;x+=44){ ctx.fillRect(x,0,2,cvs.height); } for(let y=0;y<cvs.height;y+=44){ ctx.fillRect(0,y,cvs.width,2); } waters.forEach(w=>{ ctx.fillStyle='#000'; ctx.fillRect(w.x-3,w.y-3,w.w+6,w.h+6); ctx.fillStyle='#4fc3f7'; ctx.fillRect(w.x,w.y,w.w,w.h); }); items.forEach(it=>{ if(it.ok) return; ctx.fillStyle='#000'; ctx.fillRect(it.x-2,it.y-2,it.w+4,it.h+4); ctx.fillStyle=it.c; ctx.fillRect(it.x,it.y,it.w,it.h); ctx.fillStyle='#000'; ctx.font='18px monospace'; ctx.fillText(it.e,it.x+2,it.y+19); }); const isSlow=Date.now()<player.slowUntil; ctx.fillStyle=isSlow?'#42a5f5':'#000'; ctx.fillRect(player.x-3,player.y-3,player.w+6,player.h+6); ctx.fillStyle=isSlow?'#90caf9':'#ffdbac'; ctx.fillRect(player.x,player.y,player.w,player.h); ctx.fillStyle=isSlow?'#0d47a1':'#1565c0'; ctx.fillRect(player.x,player.y+18,player.w,10); ctx.fillStyle='#000'; ctx.fillRect(player.x+6,player.y+6,4,4); ctx.fillRect(player.x+18,player.y+6,4,4); hSlow.style.display=isSlow?'inline':'none'; }
function loop(){ if(!running) return; let curS=player.s; if(Date.now()<player.slowUntil) curS=player.s*0.48; if(keys['ArrowUp']||keys['w']||keys['W']) player.y-=curS; if(keys['ArrowDown']||keys['s']||keys['S']) player.y+=curS; if(keys['ArrowLeft']||keys['a']||keys['A']) player.x-=curS; if(keys['ArrowRight']||keys['d']||keys['D']) player.x+=curS; player.x=Math.max(0,Math.min(cvs.width-player.w,player.x)); player.y=Math.max(0,Math.min(cvs.height-player.h,player.y)); waters.forEach(w=>{ if(player.x < w.x+w.w && player.x+player.w > w.x && player.y < w.y+w.h && player.y+player.h > w.y){ if(Date.now()>=player.slowUntil){ player.slowUntil=Date.now()+1800; hMsg.textContent='💧 LENTO 1.8s'; setTimeout(()=>{ if(running) hMsg.textContent=`NIVEL ${level}`; },1800); } } }); items.forEach(it=>{ if(it.ok) return; if(player.x < it.x+it.w && player.x+player.w > it.x && player.y < it.y+it.h && player.y+player.h > it.y){ it.ok=true; score++; hScore.textContent=`${score}/${items.length}`; hMsg.textContent=it.msg; setTimeout(()=>{ if(running) hMsg.textContent=`NIVEL ${level}`; },1300); if(score>=items.length) win(); } }); drawGame(); raf=requestAnimationFrame(loop); }
window.startGame=(lv=1)=>{ closeModal(); if(!currentUser){ alert('Espera Firebase...'); return; } game.classList.add('active'); running=true; spawnLevel(lv); clearInterval(timerInt); timerInt=setInterval(()=>{ time--; hTime.textContent=time+'s'; if(time<=0){ lose(); } },1000); loop(); };
window.exitGame=()=>{ running=false; game.classList.remove('active'); cancelAnimationFrame(raf); clearInterval(timerInt); };
window.resetGame=()=>{ spawnLevel(level); time=70+level*10; score=0; hScore.textContent=`0/${items.length}`; };
async function win(){ running=false; clearInterval(timerInt); cancelAnimationFrame(raf); const pts=score*100+time*15; const name=prompt(`¡NIVEL ${level} LIMPIO! Puntaje: ${pts}\nTu nombre:`)||'Anonimo'; const ok=await saveScore(name, pts, level); if(ok) alert('✅ Guardado en Firebase!'); if(level<3){ if(confirm('¿Siguiente nivel?')) startGame(level+1); else { exitGame(); openModal('home'); } } else { exitGame(); openModal('home'); } }
function lose(){ running=false; clearInterval(timerInt); cancelAnimationFrame(raf); alert('⏰ Tiempo! Intenta de nuevo'); exitGame(); }
window.addEventListener('keydown',e=>{ keys[e.key]=true; }); window.addEventListener('keyup',e=>{ keys[e.key]=false; });
[['pL','ArrowLeft'],['pU','ArrowUp'],['pD','ArrowDown'],['pR','ArrowRight']].forEach(([id,k])=>{ const b=document.getElementById(id); b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true}); b.addEventListener('touchend',()=>keys[k]=false); b.addEventListener('mousedown',()=>keys[k]=true); b.addEventListener('mouseup',()=>keys[k]=false); });
// FIN 620 LINEAS
</script>
