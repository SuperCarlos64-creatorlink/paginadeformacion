<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:#b8e0a8;font-family:'Fredoka',sans-serif}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}#bg{position:absolute;inset:0;background-image:linear-gradient(#a3cf93 2px,transparent 2px),linear-gradient(90deg,#a3cf93 2px,transparent 2px);background-size:42px 42px}
svg#lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.planetWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:220px;height:220px}
#planetCanvas{width:220px;height:220px;border:6px solid #000;box-shadow:12px 12px 0 #000;border-radius:50%;cursor:pointer;touch-action:none}
.pLabel{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);background:#000;color:#8aff8a;font-family:'Press Start 2P';font-size:7px;padding:8px 12px;border:3px solid #fff;white-space:nowrap;pointer-events:none}

.node.txt{font-family:'Press Start 2P';font-size:10px;margin-top:4px;color:#000;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
#modal.active{display:flex}.box{width:100%;max-width:700px;max-height:92vh;overflow:auto;background:#fffef0;border:6px solid #000;box-shadow:16px 16px 0 #000;padding:22px}
.btn{font-family:'Press Start 2P';font-size:9px;padding:11px 13px;border:4px solid #000;box-shadow:4px 4px 0 #000;cursor:pointer;margin:4px;background:#000;color:#fff}.btn.g{background:#2e7d32}.btn.r{background:#c62828}.btn.y{background:#fdd835;color:#000}
#game{position:fixed;inset:0;background:#aed581;display:none;flex-direction:column;z-index:200}#game.active{display:flex}
#hud{height:62px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-family:'Press Start 2P';font-size:7px}
#canvasGame{flex:1;width:100%;max-width:900px;margin:0 auto;background:#e6f2c8;border-left:6px solid #000;border-right:6px solid #000;display:block;touch-action:none}
#pad{display:flex;justify-content:center;gap:10px;padding:10px;background:#fff;border-top:6px solid #000;flex-wrap:wrap}.pad{width:64px;height:64px;border:4px solid #000;background:#fff;box-shadow:4px 4px 0 #000;font-size:22px;touch-action:none}
#admin{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;z-index:300;padding:14px;overflow:auto}#admin.active{display:block}.adminBox{max-width:800px;margin:0 auto;background:#fff;border:6px solid #000;box-shadow:12px 12px 0 #000;padding:16px}
.adminBox input,.adminBox textarea{width:100%;border:3px solid #000;padding:8px;margin:6px 0;font-family:'Fredoka';font-size:14px}.adminBox textarea{min-height:120px}.lbl{font-family:'Press Start 2P';font-size:8px;background:#000;color:#fff;padding:4px 6px;display:inline-block;margin-top:10px}

/* PANTALLA VOLTEA CELULAR - SOLO EN VERTICAL MOVIL */

#rotateOverlay.icon{font-size:80px;animation:spin 1.5s infinite}
#rotateOverlay h2{font-family:'Press Start 2P';font-size:14px;line-height:1.6;margin:20px 0}

const ADMIN_PASS="marvin2026";
const firebaseConfig={apiKey:"AIzaSyDGApAG4sGGxqzTNjSGENz8jC1DxFb8h8U",authDomain:"proyecto-de-formacion-80777.firebaseapp.com",projectId:"proyecto-de-formacion-80777",storageBucket:"proyecto-de-formacion-80777.firebasestorage.app",messagingSenderId:"975813170537",appId:"1:975813170537:web:5ecf041db5d9e11d84d9f8"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const auth=getAuth(app);let currentUser=null;
onAuthStateChanged(auth,u=>{if(u)currentUser=u;});
signInAnonymously(auth);
async function canSubmitToday(){if(!currentUser)return false;const ref=doc(db,"eco_limits",currentUser.uid);const snap=await getDoc(ref);if(!snap.exists())return true;const last=snap.data().lastSubmit?.toDate?snap.data().lastSubmit.toDate():new Date(snap.data().lastSubmit);return last.toDateString()!==new Date().toDateString();}
async function markSubmitted(){await setDoc(doc(db,"eco_limits",currentUser.uid),{lastSubmit:new Date(),uid:currentUser.uid},{merge:true});}
async function saveScore(name,pts,lvl){if(!currentUser)return false;if(!(await canSubmitToday())){alert('Ya jugaste hoy');return false;}await addDoc(collection(db,"eco_ranking"),{nombre:name.slice(0,20),puntos:pts,nivel:lvl,fecha:new Date(),uid:currentUser.uid});await markSubmitted();return true;}
async function loadRanking(){try{const q=query(collection(db,"eco_ranking"),orderBy("puntos","desc"),limit(8));const s=await getDocs(q);return s.docs.map(d=>d.data());}catch{return[];}}
const pCanvas=document.getElementById('planetCanvas');const pCtx=pCanvas.getContext('2d');
function drawPlanetStatic(){pCtx.clearRect(0,0,220,220);pCtx.fillStyle='#4fc3f7';pCtx.beginPath();pCtx.arc(110,110,90,0,Math.PI*2);pCtx.fill();pCtx.strokeStyle='#000';pCtx.lineWidth=6;pCtx.stroke();pCtx.fillStyle='#66bb6a';pCtx.beginPath();pCtx.moveTo(35,40);pCtx.lineTo(85,38);pCtx.lineTo(90,65);pCtx.lineTo(70,78);pCtx.lineTo(30,70);pCtx.closePath();pCtx.fill();pCtx.strokeStyle='#2e7d32';pCtx.lineWidth=2;pCtx.stroke();pCtx.beginPath();pCtx.moveTo(110,28);pCtx.lineTo(172,32);pCtx.lineTo(168,70);pCtx.lineTo(120,76);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.beginPath();pCtx.moveTo(22,98);pCtx.lineTo(68,94);pCtx.lineTo(72,138);pCtx.lineTo(28,142);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.beginPath();pCtx.moveTo(118,102);pCtx.lineTo(186,108);pCtx.lineTo(182,158);pCtx.lineTo(112,152);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.fillStyle='#000';pCtx.beginPath();pCtx.arc(82,98,9,0,Math.PI*2);pCtx.arc(138,98,9,0,Math.PI*2);pCtx.fill();pCtx.fillStyle='#fff';pCtx.beginPath();pCtx.arc(84,95,3,0,Math.PI*2);pCtx.arc(140,95,3,0,Math.PI*2);pCtx.fill();pCtx.fillStyle='#fff';pCtx.font='bold 46px monospace';pCtx.fillText('♻️',80,130);}
drawPlanetStatic();
let defaultTopics={
tipos:{c:'#ff7043',ico:'🗑️',lbl:'TIPOS',title:'🗑️ TIPOS DE CONTAMINACIÓN EN LA ESCUELA',html:`<h3>Lo que encontramos en el diagnóstico</h3><p>Durante una semana observamos y pesamos la basura de nuestra escuela y descubrimos que cada salón genera aproximadamente tres kilogramos de residuos al día, lo que significa que entre los doce salones se acumulan treinta y seis kilogramos diarios y más de setecientos veinte kilogramos al mes. Esta basura no es toda igual, sino que se divide en cuatro tipos principales que actualmente se mezclan en un solo bote, lo que impide reciclar.</p><p>El primer tipo y el más abundante es el PET y los plásticos de un solo uso, que representan cerca del sesenta por ciento del total. Son las botellas de refresco y agua, las envolturas de frituras, las bolsas de la cooperativa y el unicel. Encontramos cuarenta y siete botellas tiradas solo en los patios traseros. Una sola botella puede tardar cuatrocientos cincuenta años en degradarse y contamina mil litros de agua. El segundo tipo es el papel y el cartón, que es alrededor del veinticinco por ciento. Son hojas de cuaderno, trabajos, cartulinas y periódicos que podrían reciclarse hasta siete veces, pero al revolverse con restos de comida y líquidos ya no sirven y se desperdician más de dos kilogramos por salón al día.</p><p>El tercer tipo es la contaminación visual, que aunque no se pesa también contamina. Contamos más de ciento veinte carteles viejos pegados desde el año dos mil veintitrés, propaganda política, pizarrones rayados y cables colgando que generan estrés visual, dolor de cabeza y dificultad para concentrarse según la Organización Mundial de la Salud. El cuarto tipo es la contaminación hídrica, que es el agua que se desperdicia y se ensucia. Tres llaves de los baños gotean constantemente y cada una desperdicia treinta litros al día, es decir noventa litros diarios perdidos, además los bebederos tienen sarro acumulado y en los baños hay agua estancada que genera mal olor y mosquitos.</p><button class="btn g" onclick="startGame(1)">🎮 JUGAR NIVEL 1</button>`},
causas:{c:'#ffeb3b',ico:'🔍',lbl:'CAUSAS',title:'🔍 CAUSAS REALES',html:`<h3>¿Por qué nuestra escuela está sucia?</h3><p>La causa principal no es que los alumnos sean sucios por naturaleza, sino que la escuela no tiene la infraestructura necesaria para mantener el orden. Actualmente solo existen dos botes de basura para más de trescientos alumnos, ambos están oxidados, sin tapa, sin letreros que indiquen qué tirar y están ubicados a más de cuarenta metros de los salones, por lo que en el poco tiempo del recreo nadie alcanza a ir hasta allá.</p><p>Otra causa muy importante es el funcionamiento de la cooperativa escolar, la cual vende diariamente alrededor de doscientas botellas de PET y una gran cantidad de productos envueltos en plástico y unicel, sin ofrecer ninguna alternativa reutilizable. El ochenta por ciento de lo que se vende es desechable. A esto se suma una falta de cultura ambiental que se refleja en frases como para eso está el de la limpieza, lo que deja todo el trabajo en una sola persona de intendencia que recoge hasta cuarenta kilogramos diarios y barre tres veces al día.</p><p>También influye que no existe ningún sistema de incentivos ni sanciones, no hay brigadas ecológicas, no hay competencia entre grupos por el salón más limpio. Finalmente, la desinformación es clave, ya que en la encuesta que aplicamos a treinta alumnos descubrimos que el sesenta y cinco por ciento no sabía cuánto tiempo tarda en degradarse una botella y el ochenta por ciento no sabía qué es una composta.</p>`},
conse:{c:'#ef5350',ico:'⚠️',lbl:'CONSECUENCIAS',title:'⚠️ CONSECUENCIAS',html:`<h3>Cómo nos afecta a todos</h3><p>La contaminación en la escuela ya está teniendo consecuencias directas en nuestra salud y en nuestro aprendizaje. De acuerdo con los registros de enfermería de los meses de marzo y abril, las faltas por infecciones estomacales y respiratorias aumentaron un treinta y cinco por ciento, debido a la acumulación de polvo, a la presencia de cucarachas en los botes sin tapa y a los mosquitos que se reproducen en el agua estancada. Ocho alumnos ya reportaron alergias constantes y el mal olor en los pasillos es permanente.</p><p>En cuanto al aprendizaje, los salones alcanzan temperaturas de hasta treinta y cuatro grados porque no hay suficientes árboles que den sombra. La UNAM ha documentado que el exceso de calor y el mal olor pueden reducir la concentración hasta en un cuarenta por ciento. A nivel económico, la escuela ya gastó dos mil cien pesos solo en el último trimestre para destapar drenajes que se taparon con botellas de PET y envolturas. Si esto sigue así, el gasto anual podría llegar a ocho mil cuatrocientos pesos.</p><p>Además existe una consecuencia social y ambiental más grande, ya que una escuela sucia genera apatía y la sensación de que nadie cuida nada. Los padres y visitantes se llevan una mala impresión y baja la autoestima colectiva. Por último, esa basura no desaparece cuando se la lleva el camión, sino que termina en el tiradero municipal y de ahí es arrastrada por la lluvia hasta el río, donde una sola botella puede contaminar mil litros de agua.</p>`},
solu:{c:'#66bb6a',ico:'✅',lbl:'SOLUCIONES',title:'✅ SOLUCIONES REALES',html:`<h3>Un plan que sí funciona</h3><p>Para solucionar este problema no se necesita mucho dinero, sino organización y trabajo en equipo. El plan que proponemos tiene cinco pasos concretos y de bajo costo que ya han funcionado en otras secundarias y que podemos aplicar en un mes con la meta de reducir en un sesenta por ciento el PET, evitar que se tapen los drenajes y mejorar la calificación de higiene de la escuela de seis punto dos a nueve.</p><p>El primer paso es implementar un sistema de tres botes con caritas felices y tristes hechos por nosotros mismos con cajas de cartón grandes forradas con plástico, uno azul para PET, uno amarillo para papel y uno verde para orgánico. Cada bote tendrá una carita dibujada por los alumnos y se colocará a máximo diez metros de cada dos salones. Esta estrategia aumenta hasta en un setenta por ciento el uso correcto. El segundo paso es crear la brigada cinco por cinco, que consiste en cinco alumnos por día que durante solo cinco minutos al final del recreo recogen la basura del patio. Al grupo más limpio se le premiará con un punto extra.</p><p>El tercer paso es cambiar la cultura de la cooperativa hacia una cooperativa verde, donde se ofrezca un descuento de dos pesos a quien traiga su propio bote o termo para rellenar agua de garrafón a solo cinco pesos, lo que evitaría tirar doscientas botellas diarias. El cuarto paso es plantar un árbol por grupo, doce árboles nativos como guaje, fresno o jacaranda que en un año pueden bajar hasta tres grados la temperatura del patio y que pueden ser donados por el vivero municipal. El quinto paso es sustituir los ciento veinte carteles de papel por un pizarrón blanco grande reutilizable que ahorra cinco kilogramos de papel al mes, además de implementar una composta escolar.</p><button class="btn g" onclick="startGame(2)">🌳 JUGAR NIVEL 2</button>`},
yo:{c:'#42a5f5',ico:'🦸',lbl:'MI PROYECTO',title:'🦸 MI COMPROMISO - MARVIN',html:`<h3>Mi compromiso personal - Marvin</h3><p>Yo Marvin entiendo que este proyecto de formación no se trata solo de limpiar por obligación, sino de cambiar mis propios hábitos y demostrar con acciones que sí se puede tener una escuela limpia. Durante las próximas cuatro semanas me propongo cumplir un plan personal que he dividido en etapas. La primera semana me comprometo a traer todos los días mi botella reutilizable y mi bolsa de tela para no comprar ni una botella de PET en la cooperativa, además fabricaré con mis propias manos dos botes reciclados con cajas de cartón forradas y con caritas felices para mi salón.</p><p>En la segunda semana formaré parte activa de la brigada cinco por cinco los días lunes y viernes, dedicando cinco minutos del recreo a recoger al menos veinte residuos del patio y registrando mi puntaje en el juego interactivo de esta página para demostrar que limpiar también puede ser divertido y competitivo. En la tercera semana daré una plática de cinco minutos a los alumnos de primer grado utilizando este mapa interactivo que creé, explicándoles con datos reales cuánto tarda en degradarse cada tipo de basura y cómo separarla correctamente.</p><p>Finalmente en la cuarta semana plantaré y adoptaré mi propio árbol, me encargaré de regarlo y cuidarlo, y elaboraré una composta con los residuos orgánicos de mi casa para abonar la tierra, tomando fotografías del antes y después como evidencia. Mi meta final no es solo sacar una buena calificación, sino dejar un precedente en mi escuela y demostrar que cuando un estudiante toma la iniciativa, los demás se motivan a seguirlo. Si la escuela es de todos, limpiarla también debe ser responsabilidad de todos, y yo quiero ser el primero en empezar.</p><div style="background:#000;color:#0f0;font-family:'Press Start 2P';font-size:8px;padding:14px;text-align:center;line-height:1.7">SI LA ESCUELA ES DE TODOS,<br>LIMPIARLA TAMBIEN LO ES.<br><br>Proyecto Formación 2026<br>Marvin</div><br><button class="btn g" onclick="startGame(1)">🚀 JUGAR</button>`}
};
let topics=JSON.parse(JSON.stringify(defaultTopics));
async function loadConfig(){try{const snap=await getDoc(doc(db,"eco_config","mapa"));if(snap.exists()&&snap.data().topics)topics=snap.data().topics;}catch{}}
await loadConfig();
const positions=[{id:'tipos',x:8,y:8},{id:'causas',x:74,y:6},{id:'conse',x:78,y:64},{id:'solu',x:8,y:68},{id:'yo',x:1,y:38}];
const nodesDiv=document.getElementById('nodes');const svg=document.getElementById('lines');
function getBorder(ex,ey){const cx=innerWidth/2,cy=innerHeight*0.5,ang=Math.atan2(ey-cy,ex-cx),r=innerWidth<900?80:108;return{x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r};}
function drawLines(){svg.innerHTML='';positions.forEach(p=>{const el=document.getElementById('node-'+p.id);if(!el)return;const r=el.getBoundingClientRect(),ex=r.left+r.width/2,ey=r.top+r.height/2,s=getBorder(ex,ey),ang=Math.atan2(innerHeight*0.5-ey,innerWidth/2-ex),bx=ex+Math.cos(ang)*(r.width/2+8),by=ey+Math.sin(ang)*(r.height/2+8),mx=(s.x+bx)/2,my=(s.y+by)/2-18;const base=document.createElementNS('http://www.w3.org/2000/svg','path');base.setAttribute('d',`M ${s.x} ${s.y} Q ${mx} ${my} ${bx} ${by}`);base.setAttribute('stroke','#000');base.setAttribute('stroke-width',innerWidth<900?'9':'12');base.setAttribute('fill','none');svg.appendChild(base);const fg=document.createElementNS('http://www.w3.org/2000/svg','path');fg.setAttribute('d',`M ${s.x} ${s.y} Q ${mx} ${my} ${bx} ${by}`);fg.setAttribute('stroke',topics[p.id].c);fg.setAttribute('stroke-width',innerWidth<900?'6':'8');fg.setAttribute('fill','none');fg.setAttribute('stroke-dasharray','14 8');const anim=document.createElementNS('http://www.w3.org/2000/svg','animate');anim.setAttribute('attributeName','stroke-dashoffset');anim.setAttribute('values','0;22');anim.setAttribute('dur','0.6s');anim.setAttribute('repeatCount','indefinite');fg.appendChild(anim);svg.appendChild(fg);});}
function renderNodes(){nodesDiv.innerHTML='';positions.forEach(p=>{const d=document.createElement('div');d.id='node-'+p.id;d.className='node';d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.setProperty('--c',topics[p.id].c);d.innerHTML=`<span style="font-size:${innerWidth<900?'20px':'30px'}">${topics[p.id].ico}</span><span class="node txt">${topics[p.id].lbl}</span>`;d.onclick=()=>openModal(p.id);nodesDiv.appendChild(d);});}
renderNodes();addEventListener('resize',()=>{renderNodes();drawLines();});setTimeout(drawLines,400);
const modal=document.getElementById('modal'),box=document.getElementById('box');
async function openModal(id){if(id==='home'){const rank=await loadRanking();let rh='<div style="background:#f1f8e9;border:3px solid #000;padding:8px;font-family:Press Start 2P;font-size:7px"><b>RANKING</b><br>'+(rank.length?rank.map((r,i)=>`${i+1}. ${r.nombre} - ${r.puntos}`).join('<br>'):'Sin puntajes')+'</div>';box.innerHTML=`<h2 style="font-family:Press Start 2P;font-size:12px">🌍 ECO ESCUELA - MARVIN</h2><p style="font-size:14px">Proyecto Marvin</p>${rh}<br><button class="btn g" onclick="startGame()">JUGAR</button><button class="btn" onclick="closeModal()">EXPLORAR</button>`;}else{const t=topics[id];box.innerHTML=`<h2 style="font-family:Press Start 2P;font-size:12px">${t.title}</h2>${t.html}<br><button class="btn" onclick="closeModal()">CERRAR</button>`;}modal.classList.add('active');}
function closeModal(){modal.classList.remove('active');}window.closeModal=closeModal;
let clicks=0,lastClick=0,pressTimer=null;
function openAdmin(){document.getElementById('admin').classList.add('active');}
pCanvas.addEventListener('click',()=>{const now=Date.now();if(now-lastClick>800)clicks=0;clicks++;lastClick=now;if(clicks>=5){openAdmin();clicks=0;}else if(clicks==1){setTimeout(()=>{if(clicks==1)openModal('home');},300);}});
pCanvas.addEventListener('touchstart',()=>{pressTimer=setTimeout(()=>{openAdmin();},1200);},{passive:true});
pCanvas.addEventListener('touchend',()=>{clearTimeout(pressTimer);});
pCanvas.addEventListener('touchmove',()=>{clearTimeout(pressTimer);});
window.closeAdmin=()=>{document.getElementById('admin').classList.remove('active');}
window.checkAdmin=()=>{if(document.getElementById('passInput').value===ADMIN_PASS){document.getElementById('adminLogin').style.display='none';document.getElementById('adminPanel').style.display='block';buildAdminFields();}else alert('Mal');}
function buildAdminFields(){const cont=document.getElementById('adminFields');cont.innerHTML='';Object.keys(topics).forEach(k=>{const t=topics[k];cont.innerHTML+=`<div class="lbl">${k}</div><input id="${k}_lbl" value="${t.lbl}"><input id="${k}_ico" value="${t.ico}"><input id="${k}_c" value="${t.c}"><input id="${k}_title" value="${t.title}"><textarea id="${k}_html">${t.html}</textarea>`;});}
window.saveConfig=async()=>{Object.keys(topics).forEach(k=>{topics[k].lbl=document.getElementById(k+'_lbl').value;topics[k].ico=document.getElementById(k+'_ico').value;topics[k].c=document.getElementById(k+'_c').value;topics[k].title=document.getElementById(k+'_title').value;topics[k].html=document.getElementById(k+'_html').value;});await setDoc(doc(db,"eco_config","mapa"),{topics,updated:new Date()});renderNodes();setTimeout(drawLines,200);alert('Guardado');}
window.resetConfig=async()=>{if(!confirm('Restaurar?'))return;topics=JSON.parse(JSON.stringify(defaultTopics));await setDoc(doc(db,"eco_config","mapa"),{topics,updated:new Date()});renderNodes();drawLines();buildAdminFields();alert('Restaurado');}
window.clearRanking=async()=>{if(!confirm('Borrar ranking?'))return;const snap=await getDocs(collection(db,"eco_ranking"));for(const d of snap.docs){await deleteDoc(d.ref);}alert('Borrado');}
window.clearLimits=async()=>{const snap=await getDocs(collection(db,"eco_limits"));for(const d of snap.docs){await deleteDoc(d.ref);}alert('Limites borrados');}
const game=document.getElementById('game'),cvs=document.getElementById('canvasGame'),ctx=cvs.getContext('2d'),hScore=document.getElementById('hScore'),hTime=document.getElementById('hTime'),hMsg=document.getElementById('hMsg'),hSlow=document.getElementById('hSlow');
let keys={},running=false,score=0,time=0,level=1,items=[],waters=[],particles=[],floaters=[],player={x:450,y:260,w:28,h:28,s:4.6,slowUntil:0,anim:0,dir:1},raf,timerInt,t=0;
function spawnLevel(lv){items=[];waters=[];particles=[];floaters=[];level=lv;score=0;time=75+lv*12;player.x=450;player.y=260;const themes={1:{bg:'#dcedc8',pool:[{c:'#ff7043',e:'🥤'},{c:'#fff59d',e:'📄'}]},2:{bg:'#fff9c4',pool:[{c:'#90caf9',e:'🪑'},{c:'#ffcc80',e:'✏️'}]},3:{bg:'#c8e6c9',pool:[{c:'#ff7043',e:'🥤'},{c:'#ce93d8',e:'🍬'}]}};const th=themes[lv]||themes[1];cvs.dataset.bg=th.bg;for(let i=0;i<22+lv*4;i++){const pr=th.pool[Math.floor(Math.random()*th.pool.length)];items.push({x:Math.random()*830+20,y:Math.random()*450+40,w:28,h:28,c:pr.c,e:pr.e,ok:false,bob:Math.random()*6});}for(let i=0;i<3+lv;i++)waters.push({x:Math.random()*700+50,y:Math.random()*380+50,w:110,h:60,phase:Math.random()*6});hScore.textContent=`0/${items.length}`;hMsg.textContent='NIVEL '+lv;}
function drawGame(){t+=0.05;const bg=cvs.dataset.bg||'#dcedc8';ctx.fillStyle=bg;ctx.fillRect(0,0,900,520);waters.forEach(w=>{ctx.fillStyle='#000';ctx.fillRect(w.x-3,w.y-3,w.w+6,w.h+6);ctx.fillStyle='#4fc3f7';ctx.fillRect(w.x,w.y,w.w,w.h);});items.forEach(it=>{if(it.ok)return;let bobY=it.y+Math.sin(t+it.bob)*4;ctx.fillStyle='#000';ctx.fillRect(it.x-2,bobY-2,it.w+4,it.h+6);ctx.fillStyle=it.c;ctx.fillRect(it.x,bobY,it.w,it.h);ctx.font='20px monospace';ctx.fillText(it.e,it.x+3,bobY+20);});particles.forEach((p,i)=>{p.life-=0.02;if(p.life<=0){particles.splice(i,1);return;}ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;});floaters.forEach((f,i)=>{f.y-=1.2;f.life-=0.02;if(f.life<=0){floaters.splice(i,1);return;}ctx.globalAlpha=f.life;ctx.fillStyle='#000';ctx.font='bold 12px Press Start 2P';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;});let isSlow=Date.now()<player.slowUntil;if(keys['ArrowUp']||keys['w'])player.anim+=0.28;let legOff=Math.sin(player.anim)*6;ctx.fillStyle='#000';ctx.fillRect(player.x-3,player.y-3,player.w+6,player.h+8);ctx.fillStyle=isSlow?'#90caf9':'#ffdbac';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillRect(player.x+4,player.y+player.h+legOff,6,6);ctx.fillRect(player.x+18,player.y+player.h-legOff,6,6);hSlow.style.display=isSlow?'inline':'none';}
function loop(){if(!running)return;let dx=0,dy=0;if(keys['ArrowUp']||keys['w'])dy=-1;if(keys['ArrowDown']||keys['s'])dy=1;if(keys['ArrowLeft']||keys['a'])dx=-1;if(keys['ArrowRight']||keys['d'])dx=1;if(dx&&dy){dx*=0.707;dy*=0.707;}let curS=player.s;if(Date.now()<player.slowUntil)curS*=0.45;player.x+=dx*curS;player.y+=dy*curS;player.x=Math.max(2,Math.min(870,player.x));player.y=Math.max(2,Math.min(484,player.y));waters.forEach(w=>{if(player.x<w.x+w.w&&player.x+player.w>w.x&&player.y<w.y+w.h&&player.y+player.h>w.y&&Date.now()>=player.slowUntil){player.slowUntil=Date.now()+1800;}});items.forEach(it=>{if(it.ok)return;if(player.x<it.x+it.w&&player.x+player.w>it.x&&player.y<it.y+it.h&&player.y+player.h>it.y){it.ok=true;score++;hScore.textContent=`${score}/${items.length}`;for(let i=0;i<8;i++)particles.push({x:it.x+14,y:it.y+14,vx:(Math.random()-0.5)*5,vy:-2,c:it.c,life:1});floaters.push({x:it.x,y:it.y-10,txt:'+10',life:1});if(score>=items.length)setTimeout(win,300);}});drawGame();raf=requestAnimationFrame(loop);}
window.startGame=(lv=1)=>{closeModal();if(!currentUser){alert('Espera Firebase');return;}game.classList.add('active');running=true;spawnLevel(lv);clearInterval(timerInt);timerInt=setInterval(()=>{time--;hTime.textContent=time+'s';if(time<=0){clearInterval(timerInt);alert('Tiempo!');exitGame();}},1000);loop();};
window.exitGame=()=>{running=false;game.classList.remove('active');cancelAnimationFrame(raf);clearInterval(timerInt);};
async function win(){running=false;clearInterval(timerInt);cancelAnimationFrame(raf);const pts=score*20+time*5;const name=prompt(`NIVEL ${level} LIMPIO! ${pts} pts\nNombre:`)||'Marvin';const ok=await saveScore(name,pts,level);if(ok)alert('Guardado!');if(level<3){if(confirm('Siguiente nivel?'))startGame(level+1);else exitGame();}else exitGame();}
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
[['pL','ArrowLeft'],['pU','ArrowUp'],['pD','ArrowDown'],['pR','ArrowRight']].forEach(([id,k])=>{const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true;},{passive:false});b.addEventListener('touchend',()=>keys[k]=false);b.addEventListener('mousedown',()=>keys[k]=true);b.addEventListener('mouseup',()=>keys[k]=false);});
</script>
</body>
</html>
