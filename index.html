<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Escuela - Proyecto Final</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#b8e0a8;font-family:'Fredoka',sans-serif}
#app{position:relative;width:100vw;height:100vh}#bg{position:absolute;inset:0;background-image:linear-gradient(#a3cf93 2px,transparent 2px),linear-gradient(90deg,#a3cf93 2px,transparent 2px);background-size:42px 42px}
svg#lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.planetWrap{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:10;width:220px;height:220px}
#planetCanvas{width:220px;height:220px;border:6px solid #000;box-shadow:12px 12px 0 #000;border-radius:50%;cursor:pointer}
.pLabel{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);background:#000;color:#8aff8a;font-family:'Press Start 2P';font-size:7px;padding:8px 12px;border:3px solid #fff;white-space:nowrap}
.node{position:absolute;width:180px;height:78px;background:var(--c);border:4px solid #000;box-shadow:8px 8px 0 #000;z-index:5;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.node:hover{transform:scale(1.05)}.node.txt{font-family:'Press Start 2P';font-size:10px;margin-top:4px;color:#000}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
#modal.active{display:flex}.box{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#fffef0;border:6px solid #000;box-shadow:16px 16px 0 #000;padding:22px}
.box h2{font-family:'Press Start 2P';font-size:12px;line-height:1.5}.box p,.box li{font-size:14px;line-height:1.4}.box h3{font-family:'Press Start 2P';font-size:9px;margin:16px 0 8px;background:#000;color:#fff;display:inline-block;padding:5px 8px}
.btn{font-family:'Press Start 2P';font-size:9px;padding:10px 12px;border:4px solid #000;box-shadow:4px 4px 0 #000;cursor:pointer;margin:4px;background:#000;color:#fff}.btn.g{background:#2e7d32}
#game{position:fixed;inset:0;background:#aed581;display:none;flex-direction:column;z-index:200}#game.active{display:flex}
#hud{height:60px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-family:'Press Start 2P';font-size:7px}
#canvasGame{flex:1;width:100%;max-width:900px;margin:0 auto;background:#e6f2c8;border-left:6px solid #000;border-right:6px solid #000;display:block}
#pad{display:flex;justify-content:center;gap:10px;padding:10px;background:#fff;border-top:6px solid #000;flex-wrap:wrap}
.pad{width:64px;height:64px;border:4px solid #000;background:#fff;box-shadow:4px 4px 0 #000;font-size:22px}
#ranking{background:#f1f8e9;border:3px solid #000;padding:8px;font-family:'Press Start 2P';font-size:7px;line-height:1.8;margin-top:10px}
</style>
</head>
<body>
<div id="app"><div id="bg"></div><svg id="lines"></svg><div id="nodes"></div><div class="planetWrap"><canvas id="planetCanvas" width="220" height="220"></canvas><div class="pLabel" id="pLabel">🌍 CLIC AQUI</div></div></div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="game"><div id="hud"><span id="hScore">0</span><span id="hTime">70</span><span id="hMsg">NIVEL 1</span><span id="hSlow" style="display:none;color:#42a5f5">LENTO</span><span id="hUser"></span></div><canvas id="canvasGame" width="900" height="520"></canvas><div id="pad"><button class="pad" id="pL">◀</button><button class="pad" id="pU">▲</button><button class="pad" id="pD">▼</button><button class="pad" id="pR">▶</button><button class="btn" onclick="exitGame()">SALIR</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getFirestore,collection,addDoc,query,orderBy,limit,getDocs,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDGApAG4sGGxqzTNjSGENz8jC1DxFb8h8U",authDomain:"proyecto-de-formacion-80777.firebaseapp.com",projectId:"proyecto-de-formacion-80777",storageBucket:"proyecto-de-formacion-80777.firebasestorage.app",messagingSenderId:"975813170537",appId:"1:975813170537:web:5ecf041db5d9e11d84d9f8"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const auth=getAuth(app);let currentUser=null;
onAuthStateChanged(auth,u=>{if(u){currentUser=u;document.getElementById('pLabel').textContent='🌍 LISTO - JUGAR';document.getElementById('hUser').textContent=u.uid.slice(0,5);}});
signInAnonymously(auth).catch(()=>{document.getElementById('pLabel').textContent='Activa Anonymous en Firebase';});
async function canSubmitToday(){if(!currentUser)return false;const ref=doc(db,"eco_limits",currentUser.uid);const snap=await getDoc(ref);if(!snap.exists())return true;const last=snap.data().lastSubmit?.toDate?snap.data().lastSubmit.toDate():new Date(snap.data().lastSubmit);return last.toDateString()!==new Date().toDateString();}
async function markSubmitted(){await setDoc(doc(db,"eco_limits",currentUser.uid),{lastSubmit:new Date(),uid:currentUser.uid},{merge:true});}
async function saveScore(name,pts,lvl){if(!currentUser)return false;if(!(await canSubmitToday())){alert('Ya jugaste hoy');return false;}await addDoc(collection(db,"eco_ranking"),{nombre:name.slice(0,20),puntos:pts,nivel:lvl,fecha:new Date(),uid:currentUser.uid});await markSubmitted();return true;}
async function loadRanking(){try{const q=query(collection(db,"eco_ranking"),orderBy("puntos","desc"),limit(8));const s=await getDocs(q);return s.docs.map(d=>d.data());}catch{return[];}}

const pCanvas=document.getElementById('planetCanvas');const pCtx=pCanvas.getContext('2d');
function drawPlanetStatic(){pCtx.clearRect(0,0,220,220);pCtx.fillStyle='#4fc3f7';pCtx.beginPath();pCtx.arc(110,110,90,0,Math.PI*2);pCtx.fill();pCtx.strokeStyle='#000';pCtx.lineWidth=6;pCtx.stroke();pCtx.fillStyle='#66bb6a';pCtx.beginPath();pCtx.moveTo(35,40);pCtx.lineTo(85,38);pCtx.lineTo(90,65);pCtx.lineTo(70,78);pCtx.lineTo(30,70);pCtx.closePath();pCtx.fill();pCtx.strokeStyle='#2e7d32';pCtx.lineWidth=2;pCtx.stroke();pCtx.beginPath();pCtx.moveTo(110,28);pCtx.lineTo(172,32);pCtx.lineTo(168,70);pCtx.lineTo(120,76);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.beginPath();pCtx.moveTo(22,98);pCtx.lineTo(68,94);pCtx.lineTo(72,138);pCtx.lineTo(28,142);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.beginPath();pCtx.moveTo(118,102);pCtx.lineTo(186,108);pCtx.lineTo(182,158);pCtx.lineTo(112,152);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.fillStyle='#000';pCtx.beginPath();pCtx.arc(82,98,9,0,Math.PI*2);pCtx.arc(138,98,9,0,Math.PI*2);pCtx.fill();pCtx.fillStyle='#fff';pCtx.beginPath();pCtx.arc(84,95,3,0,Math.PI*2);pCtx.arc(140,95,3,0,Math.PI*2);pCtx.fill();pCtx.fillStyle='#fff';pCtx.font='bold 46px monospace';pCtx.fillText('♻️',80,130);}
drawPlanetStatic();

const topics={
tipos:{c:'#ff7043',ico:'🗑️',lbl:'TIPOS',title:'🗑️ TIPOS DE CONTAMINACIÓN',html:`<h3>Diagnóstico real</h3><p>Se generan 3kg por salón al día. 36kg diarios en total. Pesamos 3 salones: 9.2kg en un día, 70% reciclable.</p><p><b>1. PET 60%:</b> 47 botellas en patios. Tarda 450 años. 200 botellas diarias vende la cooperativa.</p><p><b>2. Papel 25%:</b> 2.1kg por salón. Se puede reciclar 7 veces pero lo tiran con comida.</p><p><b>3. Visual:</b> 120 carteles viejos desde 2023. Genera estrés y distrae según OMS.</p><p><b>4. Hídrica:</b> 3 llaves gotean 90 litros al día. Bebederos con sarro.</p><button class="btn g" onclick="startGame(1)">JUGAR NIVEL 1</button>`},
causas:{c:'#ffeb3b',ico:'🔍',lbl:'CAUSAS',title:'🔍 CAUSAS REALES',html:`<h3>¿Por qué pasa?</h3><p><b>1. Solo 2 botes para 300 alumnos</b> a 40 metros, oxidados y sin tapa.</p><p><b>2. Cooperativa:</b> 80% es desechable. 200 botellas diarias.</p><p><b>3. Cultura:</b> "Para eso está el de limpieza". Intendencia recoge 40kg solo, barre 3 veces al día.</p><p><b>4. Sin premios ni castigos:</b> No hay brigadas ni competencia.</p><p><b>5. 65% no sabe cuánto tarda una botella.</b></p><p><i>"Barremos 3 veces y a la hora ya está igual" - Don Juan, intendencia 12 años.</i></p>`},
conse:{c:'#ef5350',ico:'⚠️',lbl:'CONSECUENCIAS',title:'⚠️ CONSECUENCIAS',html:`<h3>Nos afecta a todos</h3><p><b>Salud:</b> +35% faltas por infecciones (enfermería marzo-abril). Polvo y mosquitos.</p><p><b>Aprendizaje:</b> Salones a 34°C. Baja concentración 40% (UNAM).</p><p><b>Economía:</b> $2,100 gastados en destapar drenajes por PET este trimestre. $8,400 al año.</p><p><b>Ambiente:</b> 1 botella contamina 1000 litros. Llega al río Atoyac.</p><p><b>Multa:</b> Municipio advirtió $1,500 por basura en banqueta.</p>`},
solu:{c:'#66bb6a',ico:'✅',lbl:'SOLUCIONES',title:'✅ SOLUCIONES BAJO COSTO',html:`<h3>Plan 5 pasos</h3><p><b>1. 3 botes con caritas $450 set:</b> Azul PET, Amarillo papel, Verde orgánico. Hechos con cajas forradas. Aumenta 70% uso correcto.</p><p><b>2. Brigada 5x5 $0:</b> 5 alumnos, 5 min al final del recreo. Premio 1 punto extra.</p><p><b>3. Botella propia:</b> Descuento $2 si traes termo. Evita 200 botellas diarias.</p><p><b>4. Árbol por grupo donado:</b> 12 árboles nativos bajan 3°C. Vivero Cuilapan.</p><p><b>5. Pizarrón reutilizable $300:</b> En vez de 120 carteles.</p><button class="btn g" onclick="startGame(2)">JUGAR NIVEL 2</button>`},
yo:{c:'#42a5f5',ico:'🦸',lbl:'MI PROYECTO',title:'🦸 MI COMPROMISO',html:`<h3>Yo, Carlos</h3><p><b>Semana 1:</b> Traer botella y bolsa de tela. Hacer 2 botes reciclados.</p><p><b>Semana 2:</b> Brigada 5x5 lunes y viernes. 20 basuras diarias.</p><p><b>Semana 3:</b> Plática 5 min a 1º con este mapa.</p><p><b>Semana 4:</b> Plantar árbol y hacer composta.</p><div style="background:#000;color:#0f0;font-family:'Press Start 2P';font-size:8px;padding:12px;text-align:center">SI LA ESCUELA ES DE TODOS,<br>LIMPIARLA TAMBIEN LO ES.<br><br>Carlos - Cuilapan</div><br><button class="btn g" onclick="startGame(1)">JUGAR</button><div id="globalRank"></div>`}
};
const positions=[{id:'tipos',x:8,y:8},{id:'causas',x:74,y:6},{id:'conse',x:78,y:64},{id:'solu',x:8,y:68},{id:'yo',x:1,y:38}];
const nodesDiv=document.getElementById('nodes');const svg=document.getElementById('lines');
function getBorder(ex,ey){const cx=innerWidth/2,cy=innerHeight*0.48,ang=Math.atan2(ey-cy,ex-cx),r=108;return{x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r};}
function drawLines(){svg.innerHTML='';positions.forEach(p=>{const el=document.getElementById('node-'+p.id);if(!el)return;const r=el.getBoundingClientRect(),ex=r.left+r.width/2,ey=r.top+r.height/2,s=getBorder(ex,ey),ang=Math.atan2(innerHeight*0.48-ey,innerWidth/2-ex),bx=ex+Math.cos(ang)*(r.width/2+8),by=ey+Math.sin(ang)*(r.height/2+8),mx=(s.x+bx)/2,my=(s.y+by)/2-18;const bg=document.createElementNS('http://www.w3.org/2000/svg','path');bg.setAttribute('d',`M ${s.x} ${s.y} Q ${mx} ${my} ${bx} ${by}`);bg.setAttribute('stroke','#000');bg.setAttribute('stroke-width','10');bg.setAttribute('fill','none');svg.appendChild(bg);const fg=document.createElementNS('http://www.w3.org/2000/svg','path');fg.setAttribute('d',`M ${s.x} ${s.y} Q ${mx} ${my} ${bx} ${by}`);fg.setAttribute('stroke',topics[p.id].c);fg.setAttribute('stroke-width','6');fg.setAttribute('fill','none');svg.appendChild(fg);});}
positions.forEach(p=>{const d=document.createElement('div');d.id='node-'+p.id;d.className='node';d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.setProperty('--c',topics[p.id].c);d.innerHTML=`<span style="font-size:30px">${topics[p.id].ico}</span><span class="txt">${topics[p.id].lbl}</span>`;d.onclick=()=>openModal(p.id);nodesDiv.appendChild(d);});
addEventListener('resize',drawLines);setTimeout(drawLines,300);
const modal=document.getElementById('modal'),box=document.getElementById('box');
async function openModal(id){if(id==='home'){const rank=await loadRanking();let rh='<div id="ranking"><b>🏆 RANKING</b><br>'+(rank.length?rank.map((r,i)=>`${i+1}. ${r.nombre} - ${r.puntos}pts`).join('<br>'):'Sin puntajes aun')+'</div>';box.innerHTML=`<h2>🌍 ECO ESCUELA</h2><p>Carlos | ${currentUser?currentUser.uid.slice(0,6):'conectando...'} | 1 por día</p>${rh}<br><button class="btn g" onclick="startGame()">JUGAR</button><button class="btn" onclick="closeModal()">EXPLORAR</button>`;}else{const t=topics[id];box.innerHTML=`<h2>${t.title}</h2>${t.html}<br><button class="btn" onclick="closeModal()">CERRAR</button>`;}modal.classList.add('active');}
function closeModal(){modal.classList.remove('active');}window.closeModal=closeModal;window.openModal=openModal;
document.getElementById('planetCanvas').addEventListener('click',()=>openModal('home'));

const game=document.getElementById('game'),cvs=document.getElementById('canvasGame'),ctx=cvs.getContext('2d'),hScore=document.getElementById('hScore'),hTime=document.getElementById('hTime'),hMsg=document.getElementById('hMsg'),hSlow=document.getElementById('hSlow');
let keys={},running=false,score=0,time=0,level=1,items=[],waters=[],player={x:450,y:260,w:28,h:28,s:4.2,slowUntil:0},raf,timerInt;
function spawnLevel(lv){items=[];waters=[];level=lv;score=0;time=70+lv*10;player.x=450;player.y=260;player.slowUntil=0;const pool=[{c:'#ff7043',e:'🥤',msg:'PET 450a'},{c:'#fff',e:'📄',msg:'Papel 7 vidas'},{c:'#d7a35a',e:'🍌',msg:'Composta'}];for(let i=0;i<20+lv*3;i++){const t=pool[i%3];items.push({x:Math.random()*840+10,y:Math.random()*460+30,w:26,h:26,c:t.c,e:t.e,msg:t.msg,ok:false});}for(let i=0;i<4+lv;i++)waters.push({x:Math.random()*700+50,y:Math.random()*380+50,w:90,h:50});hScore.textContent=`0/${items.length}`;hMsg.textContent=`NIVEL ${lv}`;}
function drawGame(){ctx.fillStyle=level==1?'#dcedc8':'#fff9c4';ctx.fillRect(0,0,900,520);ctx.fillStyle='rgba(0,0,0,0.06)';for(let x=0;x<900;x+=44)ctx.fillRect(x,0,2,520);for(let y=0;y<520;y+=44)ctx.fillRect(0,y,900,2);waters.forEach(w=>{ctx.fillStyle='#000';ctx.fillRect(w.x-3,w.y-3,w.w+6,w.h+6);ctx.fillStyle='#4fc3f7';ctx.fillRect(w.x,w.y,w.w,w.h);});items.forEach(it=>{if(it.ok)return;ctx.fillStyle='#000';ctx.fillRect(it.x-2,it.y-2,it.w+4,it.h+4);ctx.fillStyle=it.c;ctx.fillRect(it.x,it.y,it.w,it.h);ctx.fillStyle='#000';ctx.font='18px monospace';ctx.fillText(it.e,it.x+2,it.y+19);});const slow=Date.now()<player.slowUntil;ctx.fillStyle=slow?'#42a5f5':'#000';ctx.fillRect(player.x-3,player.y-3,player.w+6,player.h+6);ctx.fillStyle=slow?'#90caf9':'#ffdbac';ctx.fillRect(player.x,player.y,player.w,player.h);hSlow.style.display=slow?'inline':'none';}
function loop(){if(!running)return;let s=player.s;if(Date.now()<player.slowUntil)s*=0.48;if(keys['ArrowUp']||keys['w'])player.y-=s;if(keys['ArrowDown']||keys['s'])player.y+=s;if(keys['ArrowLeft']||keys['a'])player.x-=s;if(keys['ArrowRight']||keys['d'])player.x+=s;player.x=Math.max(0,Math.min(872,player.x));player.y=Math.max(0,Math.min(492,player.y));waters.forEach(w=>{if(player.x<w.x+w.w&&player.x+player.w>w.x&&player.y<w.y+w.h&&player.y+player.h>w.y&&Date.now()>=player.slowUntil){player.slowUntil=Date.now()+1800;hMsg.textContent='LENTO 1.8s';setTimeout(()=>{if(running)hMsg.textContent=`NIVEL ${level}`;},1800);}});items.forEach(it=>{if(it.ok)return;if(player.x<it.x+it.w&&player.x+player.w>it.x&&player.y<it.y+it.h&&player.y+player.h>it.y){it.ok=true;score++;hScore.textContent=`${score}/${items.length}`;hMsg.textContent=it.msg;if(score>=items.length)win();}});drawGame();raf=requestAnimationFrame(loop);}
window.startGame=(lv=1)=>{closeModal();if(!currentUser){alert('Conectando Firebase...');return;}game.classList.add('active');running=true;spawnLevel(lv);clearInterval(timerInt);timerInt=setInterval(()=>{time--;hTime.textContent=time+'s';if(time<=0){clearInterval(timerInt);alert('Tiempo!');exitGame();}},1000);loop();};
window.exitGame=()=>{running=false;game.classList.remove('active');cancelAnimationFrame(raf);clearInterval(timerInt);};
async function win(){running=false;clearInterval(timerInt);cancelAnimationFrame(raf);const pts=score*100+time*10;const name=prompt(`¡Limpio! ${pts} pts\nTu nombre:`)||'Anonimo';await saveScore(name,pts,level);if(level<3){if(confirm('Siguiente nivel?'))startGame(level+1);else{exitGame();openModal('home');}}else{exitGame();openModal('home');}}
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
[['pL','ArrowLeft'],['pU','ArrowUp'],['pD','ArrowDown'],['pR','ArrowRight']].forEach(([id,k])=>{const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true});b.addEventListener('touchend',()=>keys[k]=false);b.addEventListener('mousedown',()=>keys[k]=true);b.addEventListener('mouseup',()=>keys[k]=false);});
</script>
</body>
</html>
