<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eco Escuela - Marvin Animado</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;overflow:hidden;background:#b8e0a8;font-family:'Fredoka',sans-serif}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}#bg{position:absolute;inset:0;background-image:linear-gradient(#a3cf93 2px,transparent 2px),linear-gradient(90deg,#a3cf93 2px,transparent 2px);background-size:42px 42px}
svg#lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.planetWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:220px;height:220px}
#planetCanvas{width:220px;height:220px;border:6px solid #000;box-shadow:12px 12px 0 #000;border-radius:50%;touch-action:none}
.pLabel{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);background:#000;color:#8aff8a;font-family:'Press Start 2P';font-size:7px;padding:8px 12px;border:3px solid #fff;white-space:nowrap;pointer-events:none}
.node{position:absolute;width:180px;height:78px;background:var(--c);border:4px solid #000;box-shadow:8px 8px 0 #000;z-index:5;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:nodeFloat 2.5s ease-in-out infinite}
@keyframes nodeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;padding:12px}
#modal.active{display:flex}.box{width:100%;max-width:700px;max-height:92vh;overflow:auto;background:#fffef0;border:6px solid #000;box-shadow:16px 16px 0 #000;padding:22px}
.btn{font-family:'Press Start 2P';font-size:9px;padding:11px 13px;border:4px solid #000;box-shadow:4px 4px 0 #000;cursor:pointer;margin:4px;background:#000;color:#fff}.btn.g{background:#2e7d32}.btn.r{background:#c62828}
#game{position:fixed;inset:0;background:#aed581;display:none;flex-direction:column;z-index:200}#game.active{display:flex}
#hud{height:62px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-family:'Press Start 2P';font-size:7px}
#canvasGame{flex:1;width:100%;max-width:900px;margin:0 auto;background:#e6f2c8;border-left:6px solid #000;border-right:6px solid #000;display:block;touch-action:none}
#pad{display:flex;justify-content:center;gap:10px;padding:10px;background:#fff;border-top:6px solid #000}.pad{width:64px;height:64px;border:4px solid #000;background:#fff;box-shadow:4px 4px 0 #000;font-size:22px;touch-action:none}
#rotateOverlay{position:fixed;inset:0;background:#b8e0a8;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
@media(max-width:900px) and (orientation:portrait){#rotateOverlay{display:flex}#app,#modal,#game,#admin{display:none!important}}
#admin{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;z-index:300;padding:14px;overflow:auto}#admin.active{display:block}.adminBox{max-width:800px;margin:0 auto;background:#fff;border:6px solid #000;box-shadow:12px 12px 0 #000;padding:16px}
.adminBox input,.adminBox textarea{width:100%;border:3px solid #000;padding:8px;margin:6px 0;font-family:'Fredoka';font-size:14px}.adminBox textarea{min-height:120px}.lbl{font-family:'Press Start 2P';font-size:8px;background:#000;color:#fff;padding:4px 6px;display:inline-block;margin-top:10px}
</style>
</head>
<body>
<div id="rotateOverlay"><div style="font-size:80px">📱🔄</div><h2 style="font-family:'Press Start 2P';font-size:14px;line-height:1.6">VOLTEA TU<br>CELULAR<br><br><span style="font-family:Fredoka;font-size:18px">Ponlo horizontal</span></h2></div>
<div id="app"><div id="bg"></div><svg id="lines"></svg><div id="nodes"></div><div class="planetWrap"><canvas id="planetCanvas" width="220" height="220"></canvas><div class="pLabel">🌍 PROYECTO MARVIN</div></div></div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="game"><div id="hud"><span id="hScore">0</span><span id="hTime">75</span><span id="hMsg">NIVEL 1</span><span id="hSlow" style="display:none;color:#42a5f5">🧊 AGUA</span></div><canvas id="canvasGame" width="900" height="520"></canvas><div id="pad"><button class="pad" id="pL">◀</button><button class="pad" id="pU">▲</button><button class="pad" id="pD">▼</button><button class="pad" id="pR">▶</button><button class="btn" onclick="exitGame()">SALIR</button></div></div>
<div id="admin"><div class="adminBox"><h2 style="font-family:'Press Start 2P';font-size:12px">🔐 ADMIN</h2><div id="adminLogin"><input id="passInput" type="password" placeholder="Contraseña"><button class="btn g" onclick="checkAdmin()">ENTRAR</button><button class="btn" onclick="closeAdmin()">CERRAR</button></div><div id="adminPanel" style="display:none"><div id="adminFields"></div><hr><button class="btn g" onclick="saveConfig()">💾 GUARDAR</button><button class="btn g" onclick="resetConfig()">↩️ RESTAURAR</button><button class="btn r" onclick="clearRanking()">🗑️ BORRAR RANKING</button><button class="btn r" onclick="clearLimits()">🗑️ BORRAR LIMITES</button><button class="btn" onclick="closeAdmin()">CERRAR</button><div id="adminStatus"></div></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getFirestore,collection,addDoc,query,orderBy,limit,getDocs,doc,getDoc,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
const ADMIN_PASS="marvin2026";
const firebaseConfig={apiKey:"AIzaSyDGApAG4sGGxqzTNjSGENz8jC1DxFb8h8U",authDomain:"proyecto-de-formacion-80777.firebaseapp.com",projectId:"proyecto-de-formacion-80777",storageBucket:"proyecto-de-formacion-80777.firebasestorage.app",messagingSenderId:"975813170537",appId:"1:975813170537:web:5ecf041db5d9e11d84d9f8"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const auth=getAuth(app);let currentUser=null;onAuthStateChanged(auth,u=>{currentUser=u});signInAnonymously(auth);
async function canSubmitToday(){if(!currentUser)return false;const ref=doc(db,"eco_limits",currentUser.uid);const snap=await getDoc(ref);if(!snap.exists())return true;const last=snap.data().lastSubmit?.toDate?snap.data().lastSubmit.toDate():new Date(snap.data().lastSubmit);return last.toDateString()!==new Date().toDateString();}
async function markSubmitted(){await setDoc(doc(db,"eco_limits",currentUser.uid),{lastSubmit:new Date(),uid:currentUser.uid},{merge:true});}
async function saveScore(name,pts,lvl){if(!currentUser)return false;if(!(await canSubmitToday())){alert('Ya jugaste hoy');return false;}await addDoc(collection(db,"eco_ranking"),{nombre:name.slice(0,20),puntos:pts,nivel:lvl,fecha:new Date(),uid:currentUser.uid});await markSubmitted();return true;}
async function loadRanking(){try{const q=query(collection(db,"eco_ranking"),orderBy("puntos","desc"),limit(8));const s=await getDocs(q);return s.docs.map(d=>d.data());}catch{return[];}}
const pCanvas=document.getElementById('planetCanvas');const pCtx=pCanvas.getContext('2d');
function drawPlanetStatic(){pCtx.clearRect(0,0,220,220);pCtx.fillStyle='#4fc3f7';pCtx.beginPath();pCtx.arc(110,110,90,0,Math.PI*2);pCtx.fill();pCtx.strokeStyle='#000';pCtx.lineWidth=6;pCtx.stroke();pCtx.fillStyle='#66bb6a';pCtx.beginPath();pCtx.moveTo(35,40);pCtx.lineTo(85,38);pCtx.lineTo(90,65);pCtx.lineTo(70,78);pCtx.closePath();pCtx.fill();pCtx.strokeStyle='#2e7d32';pCtx.lineWidth=2;pCtx.stroke();pCtx.beginPath();pCtx.moveTo(110,28);pCtx.lineTo(172,32);pCtx.lineTo(168,70);pCtx.lineTo(120,76);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.beginPath();pCtx.moveTo(22,98);pCtx.lineTo(68,94);pCtx.lineTo(72,138);pCtx.lineTo(28,142);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.beginPath();pCtx.moveTo(118,102);pCtx.lineTo(186,108);pCtx.lineTo(182,158);pCtx.lineTo(112,152);pCtx.closePath();pCtx.fill();pCtx.stroke();pCtx.fillStyle='#000';pCtx.beginPath();pCtx.arc(82,98,9,0,Math.PI*2);pCtx.arc(138,98,9,0,Math.PI*2);pCtx.fill();pCtx.fillStyle='#fff';pCtx.beginPath();pCtx.arc(84,95,3,0,Math.PI*2);pCtx.arc(140,95,3,0,Math.PI*2);pCtx.fill();pCtx.fillStyle='#fff';pCtx.font='bold 46px monospace';pCtx.fillText('♻️',80,130);}
drawPlanetStatic();
let defaultTopics={
tipos:{c:'#ff7043',ico:'🗑️',lbl:'TIPOS',title:'🗑️ TIPOS DE CONTAMINACIÓN',html:`<h3>Diagnóstico</h3><p>3kg por salón al día, 36kg diarios en total. 60% PET, 25% papel, resto visual e hídrica. 47 botellas en patios. 120 carteles viejos. 3 llaves goteando 90L diarios.</p><button class="btn g" onclick="startGame(1)">JUGAR N1</button>`},
causas:{c:'#ffeb3b',ico:'🔍',lbl:'CAUSAS',title:'🔍 CAUSAS',html:`<p>2 botes para 300 alumnos, a 40m de salones. Cooperativa vende 200 botellas PET diarias. 80% desechable. Una sola persona limpia 40kg diarios.</p>`},
conse:{c:'#ef5350',ico:'⚠️',lbl:'CONSECUENCIAS',title:'⚠️ CONSECUENCIAS',html:`<p>35% más faltas por infecciones. 34°C en salones sin sombra. $2100 gastados en destapar drenajes. Contaminación de 1000L agua por botella.</p>`},
solu:{c:'#66bb6a',ico:'✅',lbl:'SOLUCIONES',title:'✅ SOLUCIONES',html:`<p>3 botes reciclados, brigada 5x5, cooperativa verde con descuento $2, 12 árboles nativos, pizarrón blanco en vez de 120 carteles. Meta -60% PET.</p><button class="btn g" onclick="startGame(2)">JUGAR N2</button>`},
yo:{c:'#42a5f5',ico:'🦸',lbl:'MI PROYECTO',title:'🦸 MARVIN',html:`<p>Mi compromiso 4 semanas: botella reutilizable, 2 botes hechos por mi, brigada lunes/viernes, plática a 1ro, plantar árbol y composta. Si la escuela es de todos limpiarla también lo es.</p><button class="btn g" onclick="startGame(1)">JUGAR</button>`}
};
let topics=JSON.parse(JSON.stringify(defaultTopics));
// PARTE 1 MODIFICADA - AHORA GUARDA POSICIONES TAMBIEN
let positions=[{id:'tipos',x:8,y:8},{id:'causas',x:74,y:6},{id:'conse',x:78,y:64},{id:'solu',x:8,y:68},{id:'yo',x:1,y:38}];
async function loadConfig(){
 try{
  const s=await getDoc(doc(db,"eco_config","mapa"));
  if(s.exists()){
   if(s.data().topics)topics=s.data().topics;
   if(s.data().positions)positions=s.data().positions;
  }
 }catch{}
}
await loadConfig();
const nodesDiv=document.getElementById('nodes'),svg=document.getElementById('lines');
function getBorder(ex,ey){const cx=innerWidth/2,cy=innerHeight*0.5,ang=Math.atan2(ey-cy,ex-cx),r=innerWidth<900?80:108;return{x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r};}
function drawLines(){svg.innerHTML='';positions.forEach(p=>{const el=document.getElementById('node-'+p.id);if(!el)return;const r=el.getBoundingClientRect(),ex=r.left+r.width/2,ey=r.top+r.height/2,s=getBorder(ex,ey),ang=Math.atan2(innerHeight*0.5-ey,innerWidth/2-ex),bx=ex+Math.cos(ang)*(r.width/2+8),by=ey+Math.sin(ang)*(r.height/2+8),mx=(s.x+bx)/2,my=(s.y+by)/2-18;const b=document.createElementNS('http://www.w3.org/2000/svg','path');b.setAttribute('d',`M ${s.x} ${s.y} Q ${mx} ${my} ${bx} ${by}`);b.setAttribute('stroke','#000');b.setAttribute('stroke-width','12');b.setAttribute('fill','none');svg.appendChild(b);const f=document.createElementNS('http://www.w3.org/2000/svg','path');f.setAttribute('d',`M ${s.x} ${s.y} Q ${mx} ${my} ${bx} ${by}`);f.setAttribute('stroke',topics[p.id]?.c||'#fff');f.setAttribute('stroke-width','8');f.setAttribute('fill','none');f.setAttribute('stroke-dasharray','14 8');const a=document.createElementNS('http://www.w3.org/2000/svg','animate');a.setAttribute('attributeName','stroke-dashoffset');a.setAttribute('values','0;22');a.setAttribute('dur','0.6s');a.setAttribute('repeatCount','indefinite');f.appendChild(a);svg.appendChild(f);});}
function renderNodes(){nodesDiv.innerHTML='';positions.forEach(p=>{if(!topics[p.id])return;const d=document.createElement('div');d.id='node-'+p.id;d.className='node';d.style.left=p.x+'%';d.style.top=p.y+'%';d.style.setProperty('--c',topics[p.id].c);d.innerHTML=`<span style="font-size:28px">${topics[p.id].ico}</span><span class="txt" style="font-family:Press Start 2P;font-size:9px">${topics[p.id].lbl}</span>`;d.onclick=()=>openModal(p.id);nodesDiv.appendChild(d);});}
renderNodes();addEventListener('resize',()=>{renderNodes();drawLines();});setTimeout(drawLines,400);
const modal=document.getElementById('modal'),box=document.getElementById('box');
async function openModal(id){if(id==='home'){const rank=await loadRanking();let rh='<div style="background:#f1f8e9;border:3px solid #000;padding:8px;font-family:Press Start 2P;font-size:7px"><b>RANKING</b><br>'+(rank.length?rank.map((r,i)=>`${i+1}. ${r.nombre} - ${r.puntos}`).join('<br>'):'Sin puntajes')+'</div>';box.innerHTML=`<h2 style="font-family:Press Start 2P;font-size:12px">🌍 ECO ESCUELA</h2>${rh}<br><button class="btn g" onclick="startGame()">JUGAR</button><button class="btn" onclick="closeModal()">CERRAR</button>`;}else{const t=topics[id];box.innerHTML=`<h2 style="font-family:Press Start 2P;font-size:12px">${t.title}</h2>${t.html}<br><button class="btn" onclick="closeModal()">CERRAR</button>`;}modal.classList.add('active');}
function closeModal(){modal.classList.remove('active');}window.closeModal=closeModal;
let clicks=0,lastClick=0,pressTimer=null;function openAdmin(){document.getElementById('admin').classList.add('active');}
pCanvas.addEventListener('click',()=>{const now=Date.now();if(now-lastClick>800)clicks=0;clicks++;lastClick=now;if(clicks>=5){openAdmin();clicks=0;}else if(clicks==1){setTimeout(()=>{if(clicks==1)openModal('home');},300);}});
pCanvas.addEventListener('touchstart',()=>{pressTimer=setTimeout(()=>{openAdmin();},1200);},{passive:true});pCanvas.addEventListener('touchend',()=>clearTimeout(pressTimer));pCanvas.addEventListener('touchmove',()=>clearTimeout(pressTimer));
window.closeAdmin=()=>{document.getElementById('admin').classList.remove('active');}
window.checkAdmin=()=>{if(document.getElementById('passInput').value===ADMIN_PASS){document.getElementById('adminLogin').style.display='none';document.getElementById('adminPanel').style.display='block';buildAdminFields();}else alert('Mal');}

// PARTE 2 MODIFICADA - ADMIN CON AGREGAR Y ELIMINAR
function buildAdminFields(){
 const cont=document.getElementById('adminFields');cont.innerHTML='';
 Object.keys(topics).forEach(k=>{
  const t=topics[k];
  cont.innerHTML+=`
  <div style="border:3px solid #000;padding:10px;margin:10px 0;background:#fffef0">
    <div class="lbl">${k.toUpperCase()} - ${t.lbl}</div>
    <button class="btn r" style="float:right;font-size:7px;padding:6px" onclick="deleteNode('${k}')">🗑️ ELIMINAR ESTE APARTADO</button>
    <div style="clear:both"></div>
    ID (no se cambia): <input id="${k}_id" value="${k}" disabled style="background:#ddd">
    Nombre corto: <input id="${k}_lbl" value="${t.lbl}">
    Emoji: <input id="${k}_ico" value="${t.ico}">
    Color: <input id="${k}_c" value="${t.c}" type="color" style="height:40px">
    Título grande: <input id="${k}_title" value="${t.title}">
    Contenido HTML: <textarea id="${k}_html">${t.html}</textarea>
  </div>`;
 });
 cont.innerHTML+=`<hr><button class="btn g" style="width:100%;padding:14px" onclick="addNode()">+ AGREGAR NUEVO APARTADO</button>`;
}
window.addNode=async()=>{
 const id=prompt("ID del nuevo apartado (sin espacios, minúsculas, ejemplo: metas):");
 if(!id)return;
 if(!/^[a-z0-9_]+$/.test(id))return alert("ID solo letras minúsculas, números y _ sin espacios");
 if(topics[id])return alert("Ya existe ese ID");
 const lbl=prompt("Nombre corto (ej: METAS):")||id.toUpperCase();
 topics[id]={c:'#66bb6a',ico:'✨',lbl:lbl,title:'✨ '+lbl,html:`<p>Nuevo apartado ${lbl}. Edita este texto aquí.</p>`};
 positions.push({id:id,x:Math.random()*60+15,y:Math.random()*50+15});
 await setDoc(doc(db,"eco_config","mapa"),{topics,positions,updated:new Date()});
 buildAdminFields();renderNodes();setTimeout(drawLines,300);
 alert("Apartado "+id+" agregado");
}
window.deleteNode=async(id)=>{
 if(!confirm(`¿Seguro que quieres ELIMINAR el apartado ${id.toUpperCase()}?`))return;
 delete topics[id];
 const idx=positions.findIndex(p=>p.id===id);
 if(idx>=0)positions.splice(idx,1);
 await setDoc(doc(db,"eco_config","mapa"),{topics,positions,updated:new Date()});
 buildAdminFields();renderNodes();setTimeout(drawLines,300);
 alert("Eliminado: "+id);
}
window.saveConfig=async()=>{
 const newTopics={};
 Object.keys(topics).forEach(k=>{
  newTopics[k]={
   lbl:document.getElementById(k+'_lbl').value,
   ico:document.getElementById(k+'_ico').value,
   c:document.getElementById(k+'_c').value,
   title:document.getElementById(k+'_title').value,
   html:document.getElementById(k+'_html').value
  };
 });
 topics=newTopics;
 await setDoc(doc(db,"eco_config","mapa"),{topics,positions,updated:new Date()});
 renderNodes();setTimeout(drawLines,200);
 alert('Guardado!');
}
window.resetConfig=async()=>{if(!confirm('¿Restaurar original? Se borra todo lo de Firebase'))return;topics=JSON.parse(JSON.stringify(defaultTopics));positions=[{id:'tipos',x:8,y:8},{id:'causas',x:74,y:6},{id:'conse',x:78,y:64},{id:'solu',x:8,y:68},{id:'yo',x:1,y:38}];await setDoc(doc(db,"eco_config","mapa"),{topics,positions,updated:new Date()});renderNodes();drawLines();buildAdminFields();alert('Restaurado');}
window.clearRanking=async()=>{try{if(!confirm('¿BORRAR TODO EL RANKING?'))return;const snap=await getDocs(collection(db,"eco_ranking"));if(snap.empty){alert('Ranking ya vacio');return;}for(const d of snap.docs){await deleteDoc(d.ref);}alert('Ranking borrado: '+snap.size+' docs');}catch(e){alert('Error: '+e.message+' - Cambia las reglas de Firebase');}}
window.clearLimits=async()=>{const snap=await getDocs(collection(db,"eco_limits"));for(const d of snap.docs){await deleteDoc(d.ref);}alert('Limites borrados');}

const game=document.getElementById('game'),cvs=document.getElementById('canvasGame'),ctx=cvs.getContext('2d'),hScore=document.getElementById('hScore'),hTime=document.getElementById('hTime'),hMsg=document.getElementById('hMsg'),hSlow=document.getElementById('hSlow');
let keys={},running=false,score=0,time=0,level=1,items=[],waters=[],particles=[],floaters=[],player={x:450,y:260,w:26,h:32,s:4.8,slowUntil:0,anim:0,dir:1,walking:false},raf,timerInt,t=0;
function spawnLevel(lv){items=[];waters=[];particles=[];floaters=[];level=lv;score=0;time=80+lv*10;player.x=450;player.y=260;player.anim=0;const pool=[{c:'#ff7043',e:'🥤'},{c:'#fff59d',e:'📄'},{c:'#a5d6a7',e:'🍌'},{c:'#ce93d8',e:'🍬'}];for(let i=0;i<24+lv*3;i++){const pr=pool[Math.floor(Math.random()*pool.length)];items.push({x:Math.random()*820+20,y:Math.random()*440+40,w:28,h:28,c:pr.c,e:pr.e,ok:false,bob:Math.random()*6.28,scale:1});}for(let i=0;i<3+lv;i++)waters.push({x:Math.random()*700+50,y:Math.random()*380+50,w:120,h:70,phase:Math.random()*6,wave:0});hScore.textContent=`0/${items.length}`;hMsg.textContent='NIVEL '+lv;}
function drawGame(){t+=0.06;ctx.fillStyle=cvs.dataset.bg||'#dcedc8';ctx.fillRect(0,0,900,520);ctx.fillStyle='rgba(0,0,0,0.06)';for(let x=0;x<900;x+=44)ctx.fillRect(x,0,2,520);for(let y=0;y<520;y+=44)ctx.fillRect(0,y,900,2);waters.forEach(w=>{w.wave+=0.08;ctx.fillStyle='#000';ctx.fillRect(w.x-4,w.y-4,w.w+8,w.h+8);ctx.fillStyle='#0288d1';ctx.fillRect(w.x,w.y,w.w,w.h);for(let i=0;i<3;i++){let wy=w.y+12+i*18+Math.sin(t*1.2+w.phase+i)*4;ctx.fillStyle=i==1?'#81d4fa':'#4fc3f7';for(let x=w.x+6;x<w.x+w.w-10;x+=18){let ox=Math.sin(t*2+x*0.1+w.phase)*3;ctx.fillRect(x+ox,wy,14,3);}}ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fillRect(w.x+8+Math.sin(t*0.8)*6,w.y+8,20,4);});items.forEach(it=>{if(it.ok){if(it.scale>0){it.scale-=0.15;ctx.globalAlpha=it.scale;ctx.fillStyle=it.c;ctx.fillRect(it.x+14-it.w*it.scale/2,it.y+14-it.h*it.scale/2,it.w*it.scale,it.h*it.scale);ctx.globalAlpha=1;}return;}let bobY=it.y+Math.sin(t*1.5+it.bob)*5;let bobX=it.x+Math.cos(t*0.7+it.bob)*2;ctx.fillStyle='#000';ctx.fillRect(bobX-2,bobY-2,it.w+4,it.h+6);ctx.fillStyle=it.c;ctx.fillRect(bobX,bobY,it.w,it.h);ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(bobX,bobY,it.w,5);ctx.fillStyle='#000';ctx.font='20px monospace';ctx.fillText(it.e,bobX+3,bobY+20);ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(bobX+4,bobY+it.h+4,it.w-8,4);});particles.forEach((p,i)=>{p.life-=0.025;if(p.life<=0){particles.splice(i,1);return;}ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;});floaters.forEach((f,i)=>{f.y-=1.5;f.life-=0.025;if(f.life<=0){floaters.splice(i,1);return;}ctx.globalAlpha=f.life;ctx.fillStyle='#000';ctx.font='bold 13px "Press Start 2P"';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;});let isSlow=Date.now()<player.slowUntil;player.walking=(keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight']||keys['w']||keys['a']||keys['s']||keys['d']);if(player.walking)player.anim+=isSlow?0.12:0.28;else player.anim*=0.85;let legSwing=Math.sin(player.anim)*8;let bodyBob=Math.abs(Math.sin(player.anim))*3;let px=player.x,py=player.y-bodyBob;ctx.fillStyle='#000';ctx.fillRect(px-3,py-3,player.w+6,player.h+10);ctx.fillStyle='#3e2723';ctx.fillRect(px+3,py+player.h+legSwing,7,8);ctx.fillRect(px+16,py+player.h-legSwing,7,8);ctx.fillStyle=isSlow?'#90caf9':'#ffdbac';ctx.fillRect(px,py,player.w,player.h);ctx.fillStyle=isSlow?'#1565c0':'#2e7d32';ctx.fillRect(px,py+14,player.w,14);ctx.fillStyle=isSlow?'#bbdefb':'#ffcc80';ctx.fillRect(px+2,py-8,22,12);if(keys['ArrowLeft']||keys['a'])player.dir=-1;if(keys['ArrowRight']||keys['d'])player.dir=1;ctx.fillStyle='#000';ctx.fillRect(px+5+player.dir*2,py-4,4,4);ctx.fillRect(px+17+player.dir*2,py-4,4,4);if(isSlow){ctx.strokeStyle='#29b6f6';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.strokeRect(px-8,py-12,player.w+16,player.h+26);ctx.setLineDash([]);ctx.fillStyle='rgba(41,182,246,0.3)';ctx.fillRect(px-8,py-12,player.w+16,player.h+26);}hSlow.style.display=isSlow?'inline':'none';}
function loop(){if(!running)return;let dx=0,dy=0;if(keys['ArrowUp']||keys['w']||keys['W'])dy=-1;if(keys['ArrowDown']||keys['s']||keys['S'])dy=1;if(keys['ArrowLeft']||keys['a']||keys['A'])dx=-1;if(keys['ArrowRight']||keys['d']||keys['D'])dx=1;if(dx&&dy){dx*=0.707;dy*=0.707;}let curS=player.s;if(Date.now()<player.slowUntil)curS*=0.4;player.x+=dx*curS;player.y+=dy*curS;player.x=Math.max(4,Math.min(866,player.x));player.y=Math.max(12,Math.min(476,player.y));waters.forEach(w=>{if(player.x<w.x+w.w&&player.x+player.w>w.x&&player.y<w.y+w.h&&player.y+player.h>w.y&&Date.now()>=player.slowUntil){player.slowUntil=Date.now()+2000;for(let i=0;i<12;i++)particles.push({x:player.x+13,y:player.y+16,vx:(Math.random()-0.5)*5,vy:-Math.random()*4,c:'#4fc3f7',life:1});hMsg.textContent='¡AGUA!';}});items.forEach(it=>{if(it.ok)return;if(player.x<it.x+it.w&&player.x+player.w>it.x&&player.y<it.y+it.h+4&&player.y+player.h>it.y){it.ok=true;score++;hScore.textContent=`${score}/${items.length}`;for(let i=0;i<12;i++)particles.push({x:it.x+14,y:it.y+14,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-1,c:it.c,life:1});floaters.push({x:it.x,y:it.y-12,txt:'+10',life:1});hMsg.textContent=it.e+' +10';if(score>=items.length)setTimeout(win,400);}});drawGame();raf=requestAnimationFrame(loop);}
window.startGame=(lv=1)=>{closeModal();if(!currentUser){alert('Espera 2s Firebase');return;}game.classList.add('active');running=true;spawnLevel(lv);clearInterval(timerInt);timerInt=setInterval(()=>{time--;hTime.textContent=time+'s';if(time<=0){clearInterval(timerInt);alert('Se acabo el tiempo!');exitGame();}},1000);loop();};
window.exitGame=()=>{running=false;game.classList.remove('active');cancelAnimationFrame(raf);clearInterval(timerInt);};
async function win(){running=false;clearInterval(timerInt);cancelAnimationFrame(raf);const pts=score*20+time*5;const name=prompt(`¡NIVEL ${level} LIMPIO! Puntaje ${pts}\nTu nombre:`)||'Marvin';const ok=await saveScore(name,pts,level);if(ok)alert('Guardado en ranking!');if(level<3){if(confirm('¿Siguiente nivel?'))startGame(level+1);else exitGame();}else exitGame();}
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
[['pL','ArrowLeft'],['pU','ArrowUp'],['pD','ArrowDown'],['pR','ArrowRight']].forEach(([id,k])=>{const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true;},{passive:false});b.addEventListener('touchend',()=>keys[k]=false);b.addEventListener('mousedown',()=>keys[k]=true);b.addEventListener('mouseup',()=>keys[k]=false);});
</script>
