tipos:{c:'#ff7043',ico:'🗑️',lbl:'TIPOS',title:'🗑️ TIPOS DE CONTAMINACIÓN EN LA ESCUELA',html:`
<h3>Lo que encontramos en el diagnóstico</h3>
<p>Durante una semana observamos y pesamos la basura de nuestra escuela y descubrimos que cada salón genera aproximadamente tres kilogramos de residuos al día, lo que significa que entre los doce salones se acumulan treinta y seis kilogramos diarios y más de setecientos veinte kilogramos al mes. Esta basura no es toda igual, sino que se divide en cuatro tipos principales que actualmente se mezclan en un solo bote, lo que impide reciclar.</p>
<p>El primer tipo y el más abundante es el PET y los plásticos de un solo uso, que representan cerca del sesenta por ciento del total. Son las botellas de refresco y agua, las envolturas de frituras, las bolsas de la cooperativa y el unicel. Encontramos cuarenta y siete botellas tiradas solo en los patios traseros. Una sola botella puede tardar cuatrocientos cincuenta años en degradarse y contamina mil litros de agua. El segundo tipo es el papel y el cartón, que es alrededor del veinticinco por ciento. Son hojas de cuaderno, trabajos, cartulinas y periódicos que podrían reciclarse hasta siete veces, pero al revolverse con restos de comida y líquidos ya no sirven y se desperdician más de dos kilogramos por salón al día.</p>
<p>El tercer tipo es la contaminación visual, que aunque no se pesa también contamina. Contamos más de ciento veinte carteles viejos pegados desde el año dos mil veintitrés, propaganda política, pizarrones rayados y cables colgando que generan estrés visual, dolor de cabeza y dificultad para concentrarse según la Organización Mundial de la Salud. El cuarto tipo es la contaminación hídrica, que es el agua que se desperdicia y se ensucia. Tres llaves de los baños gotean constantemente y cada una desperdicia treinta litros al día, es decir noventa litros diarios perdidos, además los bebederos tienen sarro acumulado y en los baños hay agua estancada que genera mal olor y mosquitos.</p>
<button class="btn g" onclick="startGame(1)">🎮 JUGAR NIVEL 1 - PATIO</button>`},
causas:{c:'#ffeb3b',ico:'🔍',lbl:'CAUSAS',title:'🔍 CAUSAS REALES DE LA CONTAMINACIÓN',html:`
<h3>¿Por qué nuestra escuela está sucia?</h3>
<p>La causa principal no es que los alumnos sean sucios por naturaleza, sino que la escuela no tiene la infraestructura necesaria para mantener el orden. Actualmente solo existen dos botes de basura para más de trescientos alumnos, ambos están oxidados, sin tapa, sin letreros que indiquen qué tirar y están ubicados a más de cuarenta metros de los salones, por lo que en el poco tiempo del recreo nadie alcanza a ir hasta allá. Esta falta de botes provoca que la basura se tire al piso aunque el bote esté a un metro, porque ya se normalizó ver el suelo sucio.</p>
<p>Otra causa muy importante es el funcionamiento de la cooperativa escolar, la cual vende diariamente alrededor de doscientas botellas de PET y una gran cantidad de productos envueltos en plástico y unicel, sin ofrecer ninguna alternativa reutilizable como agua de garrafón para rellenar termos o fruta sin bolsa. El ochenta por ciento de lo que se vende es desechable, lo que genera una ganancia económica pero un costo ambiental muy alto para la escuela. A esto se suma una falta de cultura ambiental que se refleja en frases que escuchamos durante las encuestas como para eso está el de la limpieza o yo pago mi inscripción y me vale, lo que deja todo el trabajo en una sola persona de intendencia que recoge hasta cuarenta kilogramos diarios y barre tres veces al día, pero a la hora ya está igual de sucio.</p>
<p>También influye que no existe ningún sistema de incentivos ni sanciones, no hay brigadas ecológicas, no hay competencia entre grupos por el salón más limpio, no hay puntos extra ni reconocimiento, por lo que no hay motivación para cambiar. Finalmente, la desinformación es clave, ya que en la encuesta que aplicamos a treinta alumnos de segundo grado descubrimos que el sesenta y cinco por ciento no sabía cuánto tiempo tarda en degradarse una botella de plástico y el ochenta por ciento no sabía qué es una composta ni cómo se hace, por lo que nunca se les ha enseñado realmente el impacto de sus acciones.</p>`},
conse:{c:'#ef5350',ico:'⚠️',lbl:'CONSECUENCIAS',title:'⚠️ CONSECUENCIAS QUE YA ESTAMOS VIVIENDO',html:`
<h3>Cómo nos afecta a todos</h3>
<p>La contaminación en la escuela ya está teniendo consecuencias directas en nuestra salud y en nuestro aprendizaje. De acuerdo con los registros de enfermería de los meses de marzo y abril, las faltas por infecciones estomacales y respiratorias aumentaron un treinta y cinco por ciento en comparación con el inicio del ciclo, debido a la acumulación de polvo, a la presencia de cucarachas en los botes sin tapa y a los mosquitos que se reproducen en el agua estancada de los baños. Ocho alumnos ya reportaron alergias constantes y el mal olor en los pasillos es permanente, lo que hace que muchos no quieran usar los baños.</p>
<p>En cuanto al aprendizaje, los salones alcanzan temperaturas de hasta treinta y cuatro grados porque no hay suficientes árboles que den sombra y la ventilación es mala por las ventanas obstruidas con carteles. La UNAM ha documentado que el exceso de calor y el mal olor pueden reducir la concentración hasta en un cuarenta por ciento, y los maestros han notado que los exámenes aplicados en los salones más sucios tienen en promedio un punto menos que en los salones limpios. A nivel económico, la escuela ya gastó dos mil cien pesos solo en el último trimestre para destapar drenajes que se taparon con botellas de PET y envolturas, dinero que pudo haberse usado para comprar balones, pintura o libros. Si esto sigue así, el gasto anual podría llegar a ocho mil cuatrocientos pesos.</p>
<p>Además existe una consecuencia social y ambiental más grande, ya que una escuela sucia genera apatía y la sensación de que nadie cuida nada, lo que se conoce como la teoría de las ventanas rotas. Cuando un espacio ya se ve descuidado, las personas dejan de esforzarse por mantenerlo limpio. Los padres y visitantes se llevan una mala impresión y baja la autoestima colectiva del alumnado. Por último, esa basura no desaparece cuando se la lleva el camión, sino que termina en el tiradero municipal y de ahí es arrastrada por la lluvia hasta el río, donde una sola botella puede contaminar mil litros de agua y eventualmente llegar al mar, por lo que lo que tiramos en la escuela contamina a toda la comunidad.</p>`},
solu:{c:'#66bb6a',ico:'✅',lbl:'SOLUCIONES',title:'✅ SOLUCIONES REALES Y DE BAJO COSTO',html:`
<h3>Un plan que sí funciona y que ya se ha probado</h3>
<p>Para solucionar este problema no se necesita mucho dinero, sino organización y trabajo en equipo. El plan que proponemos tiene cinco pasos concretos y de bajo costo que ya han funcionado en otras secundarias y que podemos aplicar en un mes con la meta de reducir en un sesenta por ciento el PET, evitar que se tapen los drenajes y mejorar la calificación de higiene de la escuela de seis punto dos a nueve.</p>
<p>El primer paso es implementar un sistema de tres botes con caritas felices y tristes hechos por nosotros mismos con cajas de cartón grandes forradas con plástico, uno azul para PET, uno amarillo para papel y uno verde para orgánico. Cada bote tendrá una carita dibujada por los alumnos y se colocará a máximo diez metros de cada dos salones. Esta estrategia de caritas aumenta hasta en un setenta por ciento el uso correcto de los botes porque los hace más visibles y divertidos, y cada set de tres botes cuesta aproximadamente cuatrocientos cincuenta pesos. El segundo paso es crear la brigada cinco por cinco, que consiste en cinco alumnos por día que durante solo cinco minutos al final del recreo recogen la basura del patio, con un rol semanal por salón y con un chaleco verde que los identifique. Al grupo más limpio de la semana se le premiará con un punto extra en formación cívica o con salir cinco minutos temprano el viernes.</p>
<p>El tercer paso es cambiar la cultura de la cooperativa hacia una cooperativa verde, donde se ofrezca un descuento de dos pesos a quien traiga su propio bote o termo para rellenar agua de garrafón a solo cinco pesos, lo que evitaría tirar doscientas botellas diarias, es decir mil a la semana. También se puede vender fruta picada sin bolsa y usar servilletas de tela. El cuarto paso es plantar un árbol por grupo, doce árboles nativos como guaje, fresno o jacaranda que en un año pueden bajar hasta tres grados la temperatura del patio y que pueden ser donados por el vivero municipal. Cada grupo adoptará su árbol y se encargará de regarlo dos veces por semana. El quinto paso es sustituir los ciento veinte carteles de papel por un pizarrón blanco grande de avisos reutilizable que cuesta alrededor de trescientos pesos y que ahorra cinco kilogramos de papel al mes, además de implementar una composta escolar con los residuos orgánicos de la cooperativa para producir tierra fértil en treinta días que servirá para los mismos árboles.</p>
<button class="btn g" onclick="startGame(2)">🌳 JUGAR NIVEL 2 - SOLUCIONES</button>`},
yo:{c:'#42a5f5',ico:'🦸',lbl:'MI PROYECTO',title:'🦸 MI COMPROMISO COMO ESTUDIANTE',html:`
<h3>Mi compromiso personal - Marvin</h3>
<p>Yo Marvin entiendo que este proyecto de formación no se trata solo de limpiar por obligación, sino de cambiar mis propios hábitos y demostrar con acciones que sí se puede tener una escuela limpia. Durante las próximas cuatro semanas me propongo cumplir un plan personal que he dividido en etapas. La primera semana me comprometo a traer todos los días mi botella reutilizable y mi bolsa de tela para no comprar ni una botella de PET en la cooperativa, además fabricaré con mis propias manos dos botes reciclados con cajas de cartón forradas y con caritas felices para mi salón, para que mis compañeros empiecen a separar la basura sin que les cueste.</p>
<p>En la segunda semana formaré parte activa de la brigada cinco por cinco los días lunes y viernes, dedicando cinco minutos del recreo a recoger al menos veinte residuos del patio y registrando mi puntaje en el juego interactivo de esta página para demostrar que limpiar también puede ser divertido y competitivo de forma sana. En la tercera semana daré una plática de cinco minutos a los alumnos de primer grado utilizando este mapa interactivo que creé, explicándoles con datos reales cuánto tarda en degradarse cada tipo de basura y cómo separarla correctamente, porque creo que si los más pequeños aprenden desde ahora, el cambio será permanente.</p>
<p>Finalmente en la cuarta semana plantaré y adoptaré mi propio árbol, me encargaré de regarlo y cuidarlo, y elaboraré una composta con los residuos orgánicos de mi casa para abonar la tierra, tomando fotografías del antes y después como evidencia de mi trabajo. Mi meta final no es solo sacar una buena calificación, sino dejar un precedente en mi escuela y demostrar que cuando un estudiante toma la iniciativa, los demás se motivan a seguirlo. Si la escuela es de todos, limpiarla también debe ser responsabilidad de todos, y yo quiero ser el primero en empezar.</p>
<div style="background:#000;color:#0f0;font-family:'Press Start 2P';font-size:8px;padding:14px;text-align:center;line-height:1.7">SI LA ESCUELA ES DE TODOS,<br>LIMPIARLA TAMBIEN LO ES.<br><br>Proyecto Formación 2026<br>Marvin</div>
<br><button class="btn g" onclick="startGame(1)">🚀 JUGAR Y DEMOSTRAR MI COMPROMISO</button><div id="globalRank"></div>`}

  const themes={1:{bg:'#dcedc8',pool:[{c:'#ff7043',e:'🥤'},{c:'#fff59d',e:'📄'},{c:'#a5d6a7',e:'🍌'}]},2:{bg:'#fff9c4',pool:[{c:'#90caf9',e:'🪑'},{c:'#ffcc80',e:'✏️'},{c:'#ef9a9a',e:'📚'}]},3:{bg:'#c8e6c9',pool:[{c:'#ff7043',e:'🥤'},{c:'#ce93d8',e:'🍬'},{c:'#bcaaa4',e:'🥡'}]}};
  const th=themes[lv]||themes[1];cvs.dataset.bg=th.bg;
  for(let i=0;i<22+lv*4;i++){const pr=th.pool[Math.floor(Math.random()*th.pool.length)];items.push({x:Math.random()*830+20,y:Math.random()*450+40,w:28,h:28,c:pr.c,e:pr.e,ok:false,bob:Math.random()*6});}
  for(let i=0;i<3+lv;i++)waters.push({x:Math.random()*700+50,y:Math.random()*380+50,w:110,h:60,phase:Math.random()*6});
  hScore.textContent=`0/${items.length}`;hMsg.textContent=lv==1?'NIVEL 1 - PATIO':lv==2?'NIVEL 2 - SALON':'NIVEL 3 - COOP';
}
function drawGame(){
  t+=0.05;const bg=cvs.dataset.bg||'#dcedc8';ctx.fillStyle=bg;ctx.fillRect(0,0,900,520);
  ctx.fillStyle='rgba(0,0,0,0.05)';for(let x=0;x<900;x+=44)ctx.fillRect(x,0,2,520);for(let y=0;y<520;y+=44)ctx.fillRect(0,y,900,2);
  waters.forEach(w=>{ctx.fillStyle='#000';ctx.fillRect(w.x-3,w.y-3,w.w+6,w.h+6);ctx.fillStyle='#4fc3f7';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle='rgba(255,255,255,0.6)';for(let i=0;i<3;i++){let ox=w.x+10+i*30+Math.sin(t+w.phase+i)*6;ctx.fillRect(ox,w.y+10+Math.sin(t*1.5+i)*4,18,3);}});
  items.forEach(it=>{if(it.ok)return;let bobY=it.y+Math.sin(t+it.bob)*4;ctx.fillStyle='#000';ctx.fillRect(it.x-2,bobY-2,it.w+4,it.h+6);ctx.fillStyle=it.c;ctx.fillRect(it.x,bobY,it.w,it.h);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(it.x,bobY,it.w,4);ctx.fillStyle='#000';ctx.font='20px monospace';ctx.fillText(it.e,it.x+3,bobY+20);});
  particles.forEach((p,i)=>{p.life-=0.02;if(p.life<=0){particles.splice(i,1);return;}ctx.globalAlpha=p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;});
  floaters.forEach((f,i)=>{f.y-=1.2;f.life-=0.02;if(f.life<=0){floaters.splice(i,1);return;}ctx.globalAlpha=f.life;ctx.fillStyle='#000';ctx.font='bold 12px "Press Start 2P"';ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;});
  let isSlow=Date.now()<player.slowUntil;let walk=(keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight']||keys['w']||keys['a']||keys['s']||keys['d']);if(walk)player.anim+=0.28;else player.anim=0;
  let legOff=Math.sin(player.anim)*6;ctx.fillStyle=isSlow?'#42a5f5':'#000';ctx.fillRect(player.x-3,player.y-3,player.w+6,player.h+8);ctx.fillStyle=isSlow?'#90caf9':'#ffdbac';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle=isSlow?'#0d47a1':'#1565c0';ctx.fillRect(player.x,player.y+16,player.w,12);
  if(keys['ArrowLeft']||keys['a'])player.dir=-1;if(keys['ArrowRight']||keys['d'])player.dir=1;
  ctx.fillStyle='#000';ctx.fillRect(player.x+6+(player.dir*2),player.y+6,4,4);ctx.fillRect(player.x+18+(player.dir*2),player.y+6,4,4);
  ctx.fillStyle='#000';ctx.fillRect(player.x+4,player.y+player.h+legOff,6,6);ctx.fillRect(player.x+18,player.y+player.h-legOff,6,6);
  if(isSlow){ctx.strokeStyle='#42a5f5';ctx.lineWidth=2;ctx.strokeRect(player.x-5,player.y-5,player.w+10,player.h+14);}hSlow.style.display=isSlow?'inline':'none';
}
function loop(){
  if(!running)return;let dx=0,dy=0;if(keys['ArrowUp']||keys['w']||keys['W'])dy=-1;if(keys['ArrowDown']||keys['s']||keys['S'])dy=1;if(keys['ArrowLeft']||keys['a']||keys['A'])dx=-1;if(keys['ArrowRight']||keys['d']||keys['D'])dx=1;
  if(dx!=0&&dy!=0){dx*=0.707;dy*=0.707;}let curS=player.s;if(Date.now()<player.slowUntil)curS*=0.45;player.x+=dx*curS;player.y+=dy*curS;
  player.x=Math.max(2,Math.min(870,player.x));player.y=Math.max(2,Math.min(484,player.y));
  waters.forEach(w=>{if(player.x<w.x+w.w&&player.x+player.w>w.x&&player.y<w.y+w.h&&player.y+player.h>w.y&&Date.now()>=player.slowUntil){player.slowUntil=Date.now()+1800;for(let i=0;i<8;i++)particles.push({x:player.x+14,y:player.y+14,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,c:'#4fc3f7',life:1});hMsg.textContent='¡AGUA! LENTO';setTimeout(()=>{if(running)hMsg.textContent=`NIVEL ${level}`;},1200);}});
  items.forEach(it=>{if(it.ok)return;if(player.x<it.x+it.w&&player.x+player.w>it.x&&player.y<it.y+it.h+4&&player.y+player.h>it.y){it.ok=true;score++;hScore.textContent=`${score}/${items.length}`;for(let i=0;i<10;i++)particles.push({x:it.x+14,y:it.y+14,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-1,c:it.c,life:1});floaters.push({x:it.x,y:it.y-10,txt:'+10',life:1});hMsg.textContent=it.e+' +10';if(score>=items.length)setTimeout(win,300);}});
  drawGame();raf=requestAnimationFrame(loop);
}
window.startGame=(lv=1)=>{closeModal();if(!currentUser){alert('Espera 2 seg Firebase');return;}game.classList.add('active');running=true;spawnLevel(lv);clearInterval(timerInt);timerInt=setInterval(()=>{time--;hTime.textContent=time+'s';if(time<=0){clearInterval(timerInt);alert('Tiempo!');exitGame();}},1000);loop();};
window.exitGame=()=>{running=false;game.classList.remove('active');cancelAnimationFrame(raf);clearInterval(timerInt);};
async function win(){running=false;clearInterval(timerInt);cancelAnimationFrame(raf);const pts=score*20+time*5;const name=prompt(`¡NIVEL ${level} LIMPIO! Puntaje ${pts}\nTu nombre:`)||'Marvin';const ok=await saveScore(name,pts,level);if(ok)alert('Guardado!');if(level<3){if(confirm('¿Siguiente nivel?'))startGame(level+1);else{exitGame();openModal('home');}}else{exitGame();openModal('home');}}
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
[['pL','ArrowLeft'],['pU','ArrowUp'],['pD','ArrowDown'],['pR','ArrowRight']].forEach(([id,k])=>{const b=document.getElementById(id);b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true});b.addEventListener('touchend',()=>keys[k]=false);b.addEventListener('mousedown',()=>keys[k]=true);b.addEventListener('mouseup',()=>keys[k]=false);});
</script>
