<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eco Escuela Final - Firebase Auth Anónimo</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;image-rendering:pixelated}
body{margin:0;overflow:hidden;background:#b8e0a8;font-family:'Fredoka',sans-serif}
#app{position:relative;width:100vw;height:100vh}
#bg{position:absolute;inset:0;background-image:linear-gradient(#a3cf93 2px,transparent 2px),linear-gradient(90deg,#a3cf93 2px,transparent 2px);background-size:42px 42px}
svg#lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.planetWrap{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:10;width:210px;height:210px}
#planetCanvas{width:210px;height:210px;border:6px solid #000;box-shadow:12px 12px 0 #000;border-radius:50%;cursor:pointer;animation:float 2.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.pLabel{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);background:#000;color:#8aff8a;font-family:'Press Start 2P';font-size:7px;padding:9px 12px;border:3px solid #fff;white-space:nowrap;text-align:center}
.node{position:absolute;width:178px;min-height:76px;background:var(--c);border:4px solid #000;box-shadow:8px 8px 0 #000;z-index:5;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;transition:0.12s}
.node:hover{transform:scale(1.06) translate(-3px,-3px);box-shadow:11px 11px 0 #000}
.node:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.node.ico{font-size:32px}.node.txt{font-family:'Press Start 2P';font-size:9px;margin-top:6px;text-align:center;line-height:1.3;color:#000}.node.sub{font-size:10px;opacity:0.8}
#modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
#modal.active{display:flex}
.box{width:100%;max-width:590px;max-height:92vh;overflow:auto;background:#fffef0;border:6px solid #000;box-shadow:16px 16px 0 #000;padding:22px;animation:zoo.48s cubic-bezier(.68,-.55,.265,1.55) forwards}
@keyframes zoo{0%{transform:scale(0) rotate(-6deg)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.box h2{font-family:'Press Start 2P';font-size:12px;line-height:1.5}
.box h3{font-family:'Press Start 2P';font-size:9px;margin:16px 0 8px;background:#000;color:#fff;display:inline-block;padding:5px 8px}
.btn{font-family:'Press Start 2P';font-size:9px;padding:12px 14px;border:4px solid #000;box-shadow:5px 5px 0 #000;cursor:pointer;margin:5px;display:inline-block;background:#000;color:#fff}
.btn.g{background:#2e7d32}.btn.b{background:#1565c0}.btn.y{background:#fdd835;color:#000}
#game{position:fixed;inset:0;background:#aed581;display:none;flex-direction:column;z-index:200}
#game.active{display:flex}
#hud{height:66px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:'Press Start 2P';font-size:7px;gap:6px}
#canvasGame{flex:1;width:100%;max-width:900px;margin:0 auto;background:#e6f2c8;border-left:6px solid #000;border-right:6px solid #000;display:block}
#pad{display:flex;justify-content:center;gap:10px;padding:12px;background:#fff;border-top:6px solid #000;flex-wrap:wrap}
.pad{width:68px;height:68px;border:4px solid #000;background:#fff;box-shadow:5px 5px 0 #000;font-size:24px}
#ranking{margin-top:10px;background:#f1f8e9;border:3px solid #000;padding:10px;max-height:150px;overflow:auto;font-family:'Press Start 2P';font-size:7px;line-height:1.8}
.badge{display:inline-block;background:#000;color:#0f0;font-family:'Press Start 2P';font-size:6px;padding:4px 6px;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <svg id="lines"></svg>
  <div id="nodes"></div>
  <div class="planetWrap"><canvas id="planetCanvas" width="210" height="210"></canvas><div class="pLabel" id="pLabel">CARGANDO FIREBASE...</div></div>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="game">
  <div id="hud"><span id="hScore">0/20</span><span id="hTime">60</span><span id="hMsg">NIVEL 1</span><span id="hSlow" style="display:none;color:#42a5f5">💧 LENTO</span><span id="hUser"></span></div>
  <canvas id="canvasGame" width="900" height="520"></canvas>
  <div id="pad"><button class="pad" id="pL">◀</button><button class="pad" id="pU">▲</button><button class="pad" id="pD">▼</button><button class="pad" id="pR">▶</button><button class="btn" onclick="exitGame()">SALIR</button><button class="btn g" onclick="resetGame()">REINICIAR</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGApAG4sGGxqzTNjSGENz8jC1DxFb8h8U",
  authDomain: "proyecto-de-formacion-80777.firebaseapp.com",
  projectId: "proyecto-de-formacion-80777",
  storageBucket: "proyecto-de-formacion-80777.firebasestorage.app",
  messagingSenderId: "975813170537",
  appId: "1:975813170537:web:5ecf041db5d9e11d84d9f8",
  measurementId: "G-8Y19M95XCX"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser=null;
onAuthStateChanged(auth, async (user)=>{
  if(user){ currentUser=user; document.getElementById('pLabel').textContent=`🌍 ${user.uid.slice(0,5)} - LISTO`; document.getElementById('hUser').textContent=user.uid.slice(0,5); }
});
signInAnonymously(auth).catch(e=>{ console.error(e); document.getElementById('pLabel').textContent='ERROR AUTH - Activa Anonymous en Firebase Console'; });

async function canSubmitToday(){
  if(!currentUser) return false;
  const ref=doc(db,"eco_limits",currentUser.uid);
  const snap=await getDoc(ref);
  if(!snap.exists()) return true;
  const last=snap.data().lastSubmit?.toDate? snap.data().lastSubmit.toDate() : new Date(snap.data().lastSubmit);
  const today=new Date(); return last.toDateString()!==today.toDateString();
}
async function markSubmitted(){
  if(!currentUser) return;
  await setDoc(doc(db,"eco_limits",currentUser.uid), {lastSubmit:new Date(), uid:currentUser.uid}, {merge:true});
}
async function saveScore(name, pts, lvl){
  if(!currentUser){ alert('Aún no conecta Firebase Auth - activa Anonymous en Console > Authentication'); return false; }
  if(!(await canSubmitToday())){ alert('Ya subiste tu puntaje hoy 🚫 Solo 1 por día para evitar spam. Vuelve mañana.'); return false; }
  await addDoc(collection(db,"eco_ranking"), { nombre:name.slice(0,21), puntos:pts, nivel:lvl, fecha:new Date(), uid:currentUser.uid, proyecto:"contaminacion-escolar" });
  await markSubmitted();
  localStorage.setItem('eco_best_'+lvl, String(Math.max(pts, parseInt(localStorage.getItem('eco_best_'+lvl)||'0'))));
  return true;
}
async function loadRanking(){
  try{
    const q=query(collection(db,"eco_ranking"), orderBy("puntos","desc"), limit(8));
    const snap=await getDocs(q);
    return snap.docs.map(d=>d.data());
  }catch(e){ console.log(e); return []; }
}
window.saveScore=saveScore; window.loadRanking=loadRanking;

// --- PLANETA DETALLADO ---
const pCanvas=document.getElementById('planetCanvas'); const pCtx=pCanvas.getContext('2d');
function drawPlanet(t=0){
  pCtx.clearRect(0,0,210,210);
  pCtx.fillStyle='#4fc3f7'; pCtx.beginPath(); pCtx.arc(105,105,88,0,Math.PI*2); pCtx.fill(); pCtx.lineWidth=6; pCtx.strokeStyle='#000'; pCtx.stroke();
  pCtx.fillStyle='#66bb6a';
  [[30,50,30,28],[110,30,60,38],[40,110,70,48],[120,110,50,40],[80,80,40,30]].forEach(([x,y,cw,ch])=>{ for(let px=x;px<x+cw;px+=8){ for(let py=y;py<y+ch;py+=8){ if(Math.random()>0.35) pCtx.fillRect(px,py,12,10); } } });
  pCtx.fillStyle='#2e7d32'; pCtx.font='bold 48px monospace'; pCtx.fillText('♻️',72,120);
  pCtx.fillStyle='#000'; pCtx.beginPath(); pCtx.arc(75,95,10,0,Math.PI*2); pCtx.arc(135,95,10,0,Math.PI*2); pCtx.fill();
  pCtx.fillStyle='#fff'; pCtx.beginPath(); pCtx.arc(78,92,4,0,Math.PI*2); pCtx.arc(138,92,4,0,Math.PI*2); pCtx.fill();
  pCtx.fillStyle='#ff8a80'; pCtx.beginPath(); pCtx.arc(60,115,6,0,Math.PI*2); pCtx.arc(150,115,6,0,Math.PI*2); pCtx.fill();
  for(let i=0;i<8;i++){ const ang=t/1000 + i*(Math.PI*2/8); const rx=100+Math.cos(ang)*98, ry=100+Math.sin(ang)*98; pCtx.fillStyle='#a5d6a7'; pCtx.beginPath(); pCtx.ellipse(rx,ry,9,5,ang,0,Math.PI*2); pCtx.fill(); pCtx.strokeStyle='#000'; pCtx.lineWidth=1.5; pCtx.stroke(); }
  requestAnimationFrame(drawPlanet);
}
drawPlanet();

// MAPA CON LINEAS CON CONTACTO REAL
const topics={
  tipos:{c:'#ff7043',ico:'🗑️',lbl:'TIPOS',sub:'4 tipos',title:'🗑️ TIPOS',html:`<ul><li><b>PET:</b> 450 años</li><li><b>Papel:</b> 3kg/día</li><li><b>Visual:</b> 120 carteles</li><li><b>Hídrica:</b> 30L/día fuga</li></ul><div id="rankTipos"></div><button class="btn g" onclick="startGame(1)">🎮 JUGAR</button>`},
  causas:{c:'#ffeb3b',ico:'🔍',lbl:'CAUSAS',sub:'por qué',title:'🔍 CAUSAS',html:`<ul><li>80% desechable en coop</li><li>2 botes para 300</li><li>Cultura 'otro limpia'</li></ul>`},
  conse:{c:'#ef5350',ico:'⚠️',lbl:'CONSECUENCIAS',sub:'nos afecta',title:'⚠️ CONSECUENCIAS',html:`<ul><li>+35% faltas</li><li>34°C sin árboles</li><li>$2000 drenaje</li></ul>`},
  solu:{c:'#66bb6a',ico:'✅',lbl:'SOLUCIONES',sub:'sí jalan',title:'✅ SOLUCIONES',html:`<ul><li>3 botes con carita</li><li>Brigada 5x5</li><li>Botella propia</li><li>1 árbol por grupo</li></ul><button class="btn g" onclick="startGame(2)">🌳 NIVEL 2</button>`},
  yo:{c:'#42a5f5',ico:'🦸',lbl:'YO PUEDO',sub:'tu rol',title:'🦸 TU MISION',html:`<p>Recoge 20 basuras, evita agua que te ralentiza.</p><div style="background:#000;color:#0f0;font-family:'Press Start 2P';font-size:8px;padding:10px;text-align:center">SI LA ESCUELA ES DE TODOS, LIMPIARLA TAMBIEN</div><br><button class="btn y" onclick="startGame(1)">🚀 INICIAR</button><div id="globalRank"></div>`}
};
const positions=[{id:'tipos',x:8,y:8},{id:'causas',x:74,y:6},{id:'conse',x:78,y:64},{id:'solu',x:8,y:68},{id:'yo',x:1,y:38}];
const nodesDiv=document.getElementById('nodes'); const svg=document.getElementById('lines');
function getPlanetBorder(ex,ey){
  const cx=window.innerWidth/2, cy=window.innerHeight*0.48; const ang=Math.atan2(ey-cy, ex-cx); const r=105; return {x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r};
}
function drawLines(){
  svg.innerHTML='';
  positions.forEach(p=>{
    const el=document.getElementById('node-'+p.id); if(!el) return;
    const rect=el.getBoundingClientRect(); const ex=rect.left+rect.width/2, ey=rect.top+rect.height/2;
    const start=getPlanetBorder(ex,ey);
    const angToCenter=Math.atan2((window.innerHeight*0.48)-ey, (window.innerWidth/2)-ex);
    const nodeBX=ex+Math.cos(angToCenter)*(rect.width/2+8), nodeBY=ey+Math.sin(angToCenter)*(rect.height/2+8);
    const midX=(start.x+nodeBX)/2, midY=(start.y+nodeBY)/2 - 18;
    const bg=document.createElementNS('http://www.w3.org/2000/svg','path');
    bg.setAttribute('d',`M ${start.x} ${start.y} Q ${midX} ${midY} ${nodeBX} ${nodeBY}`); bg.setAttribute('stroke','#000'); bg.setAttribute('stroke-width','10'); bg.setAttribute('fill','none'); bg.setAttribute('stroke-linecap','round');
    const fg=document.createElementNS('http://www.w3.org/2000/svg','path');
    fg.setAttribute('d',`M ${start.x} ${start.y} Q ${midX} ${midY} ${nodeBX} ${nodeBY}`); fg.setAttribute('stroke',topics[p.id].c); fg.setAttribute('stroke-width','6'); fg.setAttribute('fill','none'); fg.setAttribute('stroke-linecap','round'); fg.setAttribute('stroke-dasharray','12 8');
    svg.appendChild(bg); svg.appendChild(fg);
  });
}
positions.forEach(p=>{
  const d=document.createElement('div'); d.id='node-'+p.id; d.className='node'; d.style.left=p.x+'%'; d.style.top=p.y+'%'; d.style.setProperty('--c',topics[p.id].c);
  d.innerHTML=`<span class="ico">${topics[p.id].ico}</span><span class="txt">${topics[p.id].lbl}</span><span class="sub">${topics[p.id].sub}</span>`;
  d.onclick=()=>openModal(p.id); nodesDiv.appendChild(d);
});
window.addEventListener('resize',drawLines); setTimeout(drawLines,300);

const modal=document.getElementById('modal'), box=document.getElementById('box');
async function openModal(id){
  if(id==='home'){
    const rank=await loadRanking();
    let rankHTML='<div id="ranking"><b>🏆 TOP GLOBAL - FIREBASE</b><br>'+ (rank.length? rank.map((r,i)=>`${i+1}. ${r.nombre} - ${r.puntos} pts N${r.nivel} <span class="badge">${r.uid.slice(0,4)}</span>`).join('<br>') : 'Aún no hay puntajes, sé el primero!') +'</div>';
    box.innerHTML=`<h2>🌍 ECO ESCUELA - AUTH ANONIMO ON</h2><p>Conectado como: <b>${currentUser?currentUser.uid.slice(0,8):'conectando...'}</b><br>Proyecto: <b>proyecto-de-formacion-80777</b><br>1 score por día por alumno para evitar spam.</p>${rankHTML}<br><button class="btn g" onclick="startGame()">🎮 JUGAR</button><button class="btn" onclick="closeModal()">EXPLORAR</button>`;
  } else {
    const t=topics[id]; box.innerHTML=`<h2>${t.title}</h2>${t.html}<br><button class="btn" onclick="closeModal()">CERRAR</button>`;
  }
  modal.classList.add('active');
}
function closeModal(){ modal.classList.remove('active'); }
window.closeModal=closeModal; window.openModal=openModal;
document.getElementById('planetCanvas').addEventListener('click',()=>openModal('home'));

// GAME
const game=document.getElementById('game'), cvs=document.getElementById('canvasGame'), ctx=cvs.getContext('2d');
const hScore=document.getElementById('hScore'), hTime=document.getElementById('hTime'), hMsg=document.getElementById('hMsg'), hSlow=document.getElementById('hSlow');
let keys={}, running=false, score=0, time=0, level=1, items=[], waters=[], player={x:450,y:260,w:28,h:28,s:4.2,slowUntil:0}, raf, timerInt;

function spawnLevel(lv){
  items=[]; waters=[]; level=lv; score=0; time=70+lv*10; player.x=450; player.y=260; player.slowUntil=0;
  const pool=[{c:'#ff7043',e:'🥤',msg:'PET 450 años'},{c:'#fff',e:'📄',msg:'Papel 5 veces'},{c:'#d7a35a',e:'🍌',msg:'Composta 30 días'},{c:'#a5d6a7',e:'♻️',msg:'Separa -60%'}];
  for(let i=0;i<20+lv*3;i++){ const t=pool[Math.floor(Math.random()*pool.length)]; items.push({x:Math.random()*840+10,y:Math.random()*460+30,w:26,h:26,c:t.c,e:t.e,msg:t.msg,ok:false}); }
  for(let i=0;i<4+lv;i++){ waters.push({x:Math.random()*700+50,y:Math.random()*380+50,w:90,h:50}); }
  hScore.textContent=`0/${items.length}`; hMsg.textContent=`NIVEL ${lv}`;
}
function drawGame(){
  ctx.fillStyle=level==1?'#dcedc8':level==2?'#fff9c4':'#c8e6c9'; ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle='rgba(0,0,0,0.06)'; for(let x=0;x<cvs.width;x+=44){ ctx.fillRect(x,0,2,cvs.height); } for(let y=0;y<cvs.height;y+=44){ ctx.fillRect(0,y,cvs.width,2); }
  waters.forEach(w=>{ ctx.fillStyle='#000'; ctx.fillRect(w.x-3,w.y-3,w.w+6,w.h+6); ctx.fillStyle='#4fc3f7'; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.fillStyle='#81d4fa'; for(let k=0;k<3;k++){ ctx.fillRect(w.x+10+k*20, w.y+12+Math.sin(Date.now()/300+k)*3, 14,3); } });
  items.forEach(it=>{ if(it.ok) return; ctx.fillStyle='#000'; ctx.fillRect(it.x-2,it.y-2,it.w+4,it.h+4); ctx.fillStyle=it.c; ctx.fillRect(it.x,it.y,it.w,it.h); ctx.fillStyle='#000'; ctx.font='18px monospace'; ctx.fillText(it.e,it.x+2,it.y+19); });
  const isSlow=Date.now()<player.slowUntil;
  ctx.fillStyle=isSlow?'#42a5f5':'#000'; ctx.fillRect(player.x-3,player.y-3,player.w+6,player.h+6);
  ctx.fillStyle=isSlow?'#90caf9':'#ffdbac'; ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle=isSlow?'#0d47a1':'#1565c0'; ctx.fillRect(player.x,player.y+18,player.w,10);
  ctx.fillStyle='#000'; ctx.fillRect(player.x+6,player.y+6,4,4); ctx.fillRect(player.x+18,player.y+6,4,4);
  hSlow.style.display=isSlow?'inline':'none';
}
function loop(){
  if(!running) return;
  let curS=player.s; if(Date.now()<player.slowUntil) curS=player.s*0.48;
  if(keys['ArrowUp']||keys['w']||keys['W']) player.y-=curS;
  if(keys['ArrowDown']||keys['s']||keys['S']) player.y+=curS;
  if(keys['ArrowLeft']||keys['a']||keys['A']) player.x-=curS;
  if(keys['ArrowRight']||keys['d']||keys['D']) player.x+=curS;
  player.x=Math.max(0,Math.min(cvs.width-player.w,player.x)); player.y=Math.max(0,Math.min(cvs.height-player.h,player.y));
  waters.forEach(w=>{
    if(player.x < w.x+w.w && player.x+player.w > w.x && player.y < w.y+w.h && player.y+player.h > w.y){
      if(Date.now()>=player.slowUntil){ player.slowUntil=Date.now()+1800; hMsg.textContent='💧 LENTO 1.8s'; setTimeout(()=>{ if(running) hMsg.textContent=`NIVEL ${level}`; },1800); }
    }
  });
  items.forEach(it=>{
    if(it.ok) return;
    if(player.x < it.x+it.w && player.x+player.w > it.x && player.y < it.y+it.h && player.y+player.h > it.y){
      it.ok=true; score++; hScore.textContent=`${score}/${items.length}`; hMsg.textContent=it.msg; setTimeout(()=>{ if(running) hMsg.textContent=`NIVEL ${level}`; },1300);
      if(score>=items.length) win();
    }
  });
  drawGame(); raf=requestAnimationFrame(loop);
}
window.startGame=(lv=1)=>{ closeModal(); if(!currentUser){ alert('Espera, conectando a Firebase Auth...'); return; } game.classList.add('active'); running=true; spawnLevel(lv); clearInterval(timerInt); timerInt=setInterval(()=>{ time--; hTime.textContent=time+'s'; if(time<=0){ lose(); } },1000); loop(); };
window.exitGame=()=>{ running=false; game.classList.remove('active'); cancelAnimationFrame(raf); clearInterval(timerInt); };
window.resetGame=()=>{ spawnLevel(level); time=70+level*10; score=0; hScore.textContent=`0/${items.length}`; };
async function win(){
  running=false; clearInterval(timerInt); cancelAnimationFrame(raf);
  const pts=score*100+time*15; const name=prompt(`¡NIVEL ${level} LIMPIO! 🧹 Puntaje: ${pts}\nTu nombre (max 21 letras):`)||'Anonimo';
  const ok=await saveScore(name, pts, level);
  if(ok){ alert('✅ Puntaje guardado en Firebase!'); }
  if(level<3){ if(confirm('¿Siguiente nivel?')){ startGame(level+1); } else { exitGame(); openModal('home'); } } else { exitGame(); openModal('home'); }
}
function lose(){ running=false; clearInterval(timerInt); cancelAnimationFrame(raf); alert('⏰ Tiempo!'); exitGame(); }
window.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.code==='Space'&&!running) startGame(); });
window.addEventListener('keyup',e=>{ keys[e.key]=false; });
[['pL','ArrowLeft'],['pU','ArrowUp'],['pD','ArrowDown'],['pR','ArrowRight']].forEach(([id,k])=>{
  const b=document.getElementById(id); b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true}); b.addEventListener('touchend',()=>keys[k]=false);
  b.addEventListener('mousedown',()=>keys[k]=true); b.addEventListener('mouseup',()=>keys[k]=false);
});
</script>
</body>
</html>
